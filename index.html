function ghostVisible(o){const R=G.race;return !!R&&o.init&&o.sc==='play'&&o.stage===G.stage&&o.round===R.go&&(R.coop||G.mode==='race');}
function posTick(dt){
  const R=G.race;if(!R||!R.room||!W||!(R.coop||G.mode==='race'))return;
  R.pt=(R.pt||0)+dt;if(R.pt<0.12)return;
  const el=R.pt;R.pt=0;
  const f=((Math.round(Math.atan2(W.face[1],W.face[0])/(Math.PI/4))%8)+8)%8;
  const x=Math.round(W.px*50)/50,y=Math.round(W.py*50)/50,mv=W.moving?1:0,l=R.lastPos;
  R.hb=(R.hb||0)+el;
  if(l&&l.x===x&&l.y===y&&l.f===f&&l.mv===mv&&R.hb<1.5)return;
  R.hb=0;R.lastPos={x:x,y:y,f:f,mv:mv};
  raceSend({x:x,y:y,f:f,mv:mv});
}
function drawGhosts(ctx){
  const R=G.race;if(!R||!W||!(R.coop||G.mode==='race'))return;
  const now=performance.now(),dt=Math.min(0.1,(now-(R.gt||now))/1000);R.gt=now;
  const k=Math.min(1,dt*10);
  Object.keys(R.ghosts).forEach(key=>{
    const o=R.ghosts[key];if(!ghostVisible(o))return;
    o.x+=(o.tx-o.x)*k;o.y+=(o.ty-o.y)*k;
    const x=o.x*TS,y=o.y*TS,sw=o.mv?Math.sin(W.t*14+o.ph)*4:0;
    ctx.save();ctx.globalAlpha=.62;
    drawHero(ctx,x,y,{wear:o.wear,fx:o.f[0],fy:o.f[1],sw:sw,t:W.t,eyes:o.f[1]<=0.5});
    ctx.restore();
    ctx.font='700 15px Sarabun,sans-serif';ctx.textAlign='center';ctx.textBaseline='alphabetic';
    ctx.lineWidth=4;ctx.strokeStyle='rgba(0,0,0,.75)';ctx.fillStyle='rgba(255,255,255,.95)';
    ctx.strokeText(o.name,x,y-24);ctx.fillText(o.name,x,y-24);
  });
}
function raceRacers(){
  const R=G.race,out=[];
  (R.peers||[]).forEach(p=>{
    if(p.sameTab||p.kind!=='viewer')return;
    const q=p.presence||{};if(q.round!==R.go)return;
    out.push({me:false,name:cleanName(q.name)||'ผู้เล่น',stage:Math.max(0,Math.min(TOTAL,Math.floor(+q.stage)||0)),done:q.done===true,ms:numOk(q.ms)||0});
  });
  out.push({me:true,name:raceName(),stage:G.stage,done:R.ms!=null,ms:R.ms||0});
  return out.sort((a,b)=>(a.done&&b.done)?a.ms-b.ms:a.done?-1:b.done?1:b.stage-a.stage);
}
function raceHudInner(){
  const R=G.race;

  }).join('');

}
function raceHud(){return G.race&&(G.mode==='race'||G.race.coop)?'<section class="racehud" id="racehud" aria-label="ผู้แข่งขัน">'+raceHudInner()+'</section>':'';}
function updateHud(){const e=$('#racehud');if(e&&G.race)e.innerHTML=raceHudInner();}
function raceAdvance(){

function finishRace(){

function setReady(v){

  b.disabled=!v;b.textContent=FIN.i===FIN.steps.length-1?'ดูผลการหนี':'ต่อ';
  if(v&&!(document.activeElement&&document.activeElement.closest&&document.activeElement.closest('#fextra')))try{b.focus({preventScroll:true});}catch(e){}
}
function finStep(i){
  const F=FIN,s=F.steps[i];
  F.i=i;F.ready=false;F.waitFor=null;
  $('#fwho').textContent=s.who||'';$('#ftext').textContent=s.text;$('#fextra').innerHTML='';
  const b=$('#fnext');if(b)b.disabled=true;
  if(s.clock)F.clockT=s.clock;
  if(s.snd)sfx(s.snd);
  if(s.k==='talk'||s.k==='bowl'){if(s.k==='bowl'){F.bowl=true;F.bowlFill=1;}setReady(true);}
  else if(s.k==='walk'){F.tgt=s.to.slice();F.hero.moving=true;F.waitFor=()=>!F.tgt;}
  else if(s.k==='proof')finProof();
  else if(s.k==='eat'){F.eating=true;F.eat=0;F.waitFor=()=>!F.eating;}
  else if(s.k==='guests'){
    F.guests=s.guests.map((k,n)=>({k,x:304+(n?24:-24),y:390+n*14,tx:s.guests.length>1?(n?420:188):188,ty:292,done:false,w:0}));
    F.waitFor=()=>F.guests.every(g=>g.done);sfx('bell');
  }
  else if(s.k==='close'){F.closing=true;F.waitFor=()=>F.closed&&F.t>F.closeAt;}
  finClockText();
}

function finLoop(now){
  if(G.screen!=='finale')return;
  const F=FIN,dt=Math.min((now-F.last)/1000,.05);
  F.last=now;F.t+=dt;
  if(F.tgt){
    const dx=F.tgt[0]-F.hero.x,dy=F.tgt[1]-F.hero.y,d=Math.hypot(dx,dy);
    if(d<2){F.hero.x=F.tgt[0];F.hero.y=F.tgt[1];F.tgt=null;F.hero.moving=false;}
    else{const sp=Math.min(d,75*dt);F.hero.x+=dx/d*sp;F.hero.y+=dy/d*sp;F.hero.walk+=dt;}
  }
  F.guests.forEach(g=>{
    if(g.done)return;
    const dx=g.tx-g.x,dy=g.ty-g.y,d=Math.hypot(dx,dy);
    if(d<2){g.done=true;}else{const sp=Math.min(d,70*dt);g.x+=dx/d*sp;g.y+=dy/d*sp;g.w+=dt;}
  });
  if(F.clock<F.clockT){F.clock=Math.min(F.clockT,F.clock+dt*.45);finClockText();}
  if(F.closing&&!F.closed&&F.clock>=F.clockT-1e-6){F.closed=true;F.closeAt=F.t+1.8;F.dimT=.5;sfx('bell');}
  F.dim+=(F.dimT-F.dim)*Math.min(1,dt*1.5);
  if(F.eating){
    F.eat=Math.min(1,F.eat+dt/3.6);F.bowlFill=1-F.eat;
    F.slurpT-=dt;if(F.slurpT<=0&&F.eat<.95){sfx('slurp');F.slurpT=.6;}
    if(F.eat>=1){F.eating=false;F.bowlFill=0;}
  }
  if(!F.ready&&F.waitFor&&F.waitFor())setReady(true);
  const cv=$('#fin');
  if(cv)drawShop(cv.getContext('2d'),F);
  F.raf=requestAnimationFrame(finLoop);
}

  for(let k=0;k<3;k++){c.fillStyle='#f4f1e6';c.beginPath();c.ellipse(430,132-k*5,15,5,0,0,7);c.fill();c.strokeStyle='#c0392b';c.lineWidth=1.5;c.stroke();}
  // เก้าอี้
  for(const sx of [200,304,408]){c.fillStyle='#2d1b12';c.fillRect(sx-3,246,6,26);c.fillStyle='#4a2c1a';c.beginPath();c.ellipse(sx,246,16,6,0,0,7);c.fill();}
  // โต๊ะข้าง
  for(const tx of [84,524]){c.fillStyle='#2d1b12';c.fillRect(tx-4,262,8,40);c.fillStyle='#d9a566';c.beginPath();c.ellipse(tx,262,36,12,0,0,7);c.fill();c.strokeStyle='#b8864c';c.lineWidth=2;c.stroke();}
  // ประตู
  c.fillStyle='#3d1d15';c.fillRect(240,318,128,34);c.fillStyle='#0e1424';c.fillRect(248,322,112,30);
  const gr=c.createRadialGradient(304,352,4,304,352,60);gr.addColorStop(0,'rgba(255,220,140,.35)');gr.addColorStop(1,'rgba(255,220,140,0)');c.fillStyle=gr;c.fillRect(248,322,112,30);
  // ชามบนเคาน์เตอร์
  if(F.bowl)drawBowl(c,304,152,1.7,F.bowlFill,t);
  // ตะเกียบตอนกิน
  if(F.eating&&F.eat<.95){
    const p=(F.t*1.7)%1,k=p<.5?p*2:(1-p)*2,ty=152+(214-152)*k;
    c.strokeStyle='#8a5a2b';c.lineWidth=2;c.beginPath();c.moveTo(296,ty-18);c.lineTo(303,ty);c.moveTo(312,ty-18);c.lineTo(305,ty);c.stroke();
    c.strokeStyle='#f1dc8a';c.lineWidth=1.5;c.beginPath();c.moveTo(302,ty);c.quadraticCurveTo(300,ty+8,303,ty+12);c.moveTo(306,ty);c.quadraticCurveTo(308,ty+8,305,ty+12);c.stroke();
    if(k>.8){c.fillStyle='#fff';c.strokeStyle='#15201a';c.font='700 16px Sarabun, sans-serif';c.lineWidth=3;c.strokeText('ซู้ด!',350,196);c.fillText('ซู้ด!',350,196);}
  }
  // ธี
  c.save();c.translate(F.hero.x,F.hero.y);c.scale(2,2);
  drawHero(c,0,0,{wear:ME.wear,fx:0,fy:-1,sw:F.hero.moving?Math.sin(F.hero.walk*14)*4:0,t,eyes:true});
  c.restore();
  // แขก
  F.guests.forEach(g=>{c.save();c.translate(g.x,g.y);c.scale(1.8,1.8);drawNpc(c,0,0,g.k,t+(g.done?0:g.w*3));c.restore();});
  // ป้ายเปิด/ปิด
  c.fillStyle=F.closed?'#c1272d':'#2e9e5b';c.fillRect(372,326,40,18);c.fillStyle='#fff';c.font='700 13px Sarabun, sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText(F.closed?'ปิด':'เปิด',392,336);
  if(F.dim>0.01){c.fillStyle='rgba(8,8,26,'+F.dim+')';c.fillRect(0,0,Wd,Hd);}
}
document.addEventListener('keydown',e=>{
  if(G.screen==='finale'&&(e.code==='Enter'||e.code==='Space')&&!(e.target&&e.target.closest&&e.target.closest('button'))){e.preventDefault();finNext();}
});



function showPass(pop){
  stopTimer();G.screen='pass';
  const bp=ME.bp,lv=bp.lv,max=BP_LV.length;
  const base=lv?bpNeed(lv):0,nx=lv<max?bpNeed(lv+1):base;
  const pct=lv>=max?100:Math.max(0,Math.min(100,Math.round((bp.xp-base)/(nx-base)*100)));
  const ms=bp.a.map((m,i)=>{
    const d=bpDef(m),pc=Math.min(100,Math.round(m[2]/d.t*100));
    return '<div class="msn'+(pop===i?' pop':'')+'"><b>'+esc(d.name)+'</b>'
      +'<div class="xpbar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+pc+'" aria-label="ความคืบหน้าภารกิจ"><i style="width:'+pc+'%"></i></div>'
      +'<div class="row2"><span>'+m[2]+'/'+d.t+'</span><span>+'+d.xp+' XP</span></div>'
      +'<button class="btn ghost sm" data-act="bp-skip" data-i="'+i+'">เปลี่ยนภารกิจ</button></div>';
  }).join('');
  const rw=lv<max
    ?'<div class="rw"><span class="muted small">รางวัลเลเวล '+(lv+1)+' (ถัดไป)</span><b>'+esc(bpRewardText(BP_LV[lv]))+'</b><span class="mono small">อีก '+(bpNeed(lv+1)-bp.xp)+' XP</span></div>'
    :'<div class="rw"><b>เก็บครบทุกเลเวลแล้ว ยินดีด้วย</b></div>';
  main.innerHTML='<div class="topbar"><div class="who"><span class="hn">บัตรผ่านซีซัน 1</span>แผนหนีโรงบาลฉบับรางวัลเยอะ</div><div class="meta"><span class="bal">ชามก๋วยเตี๋ยวในกระเป๋า <b class="mono">'+balance()+'</b></span><button class="btn-link" data-act="home">หน้าแรก</button></div></div>'
   +'<section class="folder"><div class="ftab">ภารกิจตรงหน้า · ทำเสร็จแล้วมีภารกิจใหม่เด้งมาแทน</div><div class="card">'
   +'<div class="bphead"><p class="lvbig">เลเวล '+lv+' / '+max+'</p>'
   +'<div class="xpbar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+pct+'" aria-label="ความคืบหน้าไปเลเวลถัดไป"><i style="width:'+pct+'%"></i></div>'
   +'<p class="muted small nx">XP '+bp.xp+' · รางวัลเข้ากระเป๋าอัตโนมัติเมื่อขึ้นเลเวล</p></div>'
   +'<div class="bpbody"><div class="bpm">'+ms+'</div>'+rw+'</div>'
   +'</div></section>';
  if(pop==null)window.scrollTo(0,0);
}
function showAch(){
  stopTimer();G.screen='ach';
  const items=ACH.map(a=>{
    const got=ME.ach.includes(a.id),hid=a.secret&&!got;
    let st;
    if(got)st='ได้แล้ว +'+a.r+' ชาม';
    else if(a.p){const v=a.p();st=hid?'เหรียญลับ':Math.min(v[0],v[1])+'/'+v[1]+' · รางวัล +'+a.r+' ชาม';}
    else st='ทำภารกิจพิเศษ · รางวัล +'+a.r+' ชาม';
    return '<li class="ach'+(got?' got':'')+'"><b>'+(hid?'???':esc(a.name))+'</b><span>'+esc(a.desc)+'</span><span class="st">'+st+'</span>'+(got?'<span class="fun">'+esc(a.fun)+'</span>':'')+'</li>';
  }).join('');
  main.innerHTML='<div class="topbar"><div class="who"><span class="hn">เหรียญความสำเร็จ</span>ของคนไข้ห้อง 407</div><div class="meta"><button class="btn-link" data-act="home">หน้าแรก</button></div></div>'
   +'<section class="folder"><div class="ftab">ได้แล้ว '+ME.ach.length+' จาก '+ACH.length+' เหรียญ</div><div class="card">'
   +'<p class="muted small" style="margin:0">ทุกเหรียญให้ชามก๋วยเตี๋ยวเป็นรางวัล เอาไปซื้อชุดหรือแมวที่ห้องแต่งตัวได้</p>'
   +'<ul class="achs">'+items+'</ul></div></section>';
  window.scrollTo(0,0);
}
const ACT={
  begin:b=>startMode(b.dataset.mode),
  go:()=>beginStage(),
  retry:()=>beginStage(),
  next:()=>{if(G.stage>=lastPos()){finale();}else{G.stage++;brief();}},
  hint:()=>useHint(),
  home:b=>{
    if(G.screen==='play'&&!G.exitArm){
      G.exitArm=true;b.textContent='กดอีกครั้งเพื่อออก';
      setTimeout(()=>{G.exitArm=false;if(b.isConnected)b.textContent='หน้าแรก';},2500);return;
    }
    G.exitArm=false;showHome();
  },
  'cam-sel':b=>{const s=Number(b.dataset.s);G.S.sel=G.S.sel===s?null:s;G.S.msg='';renderStage();},
  'cam-go':()=>camGo(),
  drawer:b=>drawerOpen(Number(b.dataset.i)),
  wire:b=>cutWire(Number(b.dataset.i)),
  'mm-digit':b=>{const M=G.S.mm,d=Number(b.dataset.d);if(M.cur.length<M.len&&!M.cur.includes(d)){M.cur.push(d);renderStage();}},
  'mm-slot':b=>{G.S.mm.cur.splice(Number(b.dataset.i),1);renderStage();},
  'mm-clear':()=>{G.S.mm.cur=[];renderStage();},
  'mm-send':()=>mmSend(),use:()=>openPuzzle(),'close-puzzle':()=>closePuzzle(),
  board:()=>showBoard(),'board-tab':b=>{boardTab=b.dataset.t;showBoard(true);},
  hall:()=>showHall(),race:()=>showHall(),'race-start':()=>raceStart(),
  'race-leave':()=>{leaveRace();showHall();},
  solo:()=>startMode(G.pick&&G.pick!=='race'?G.pick:'story'),
  ward:b=>wardEnter(Number(b.dataset.n)),
  'ward-back':()=>{if(G.race)showWard();else showHall();},
  pick:b=>{
    G.pick=b.dataset.mode;
    document.querySelectorAll('.chip[data-act="pick"]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.mode===G.pick)));
    const d=$('#pickdesc');if(d)d.textContent=pickDescText(G.pick);
  },
  mute:b=>{const R=G.race;if(!R)return;const k='k'+b.dataset.k;R.mutes[k]=!R.mutes[k];const l=$('#roomlist');if(l)l.innerHTML=roomListHtml();},
  'chat-toggle':()=>chatToggle(),'chat-off':()=>chatOffToggle(),
  punch:b=>{punch();b.blur();},
  rage:b=>{goRage();b.blur();},
  snd:()=>{
    sndOn=!sndOn;try{localStorage.setItem('iq300-snd',sndOn?'1':'0');}catch(e){}
    document.querySelectorAll('[data-act="snd"]').forEach(x=>{x.textContent='เสียง: '+(sndOn?'เปิด':'ปิด');x.setAttribute('aria-pressed',String(sndOn));});
    if(sndOn)sfx('pickup');
  },
  wardrobe:()=>{WD.pre=Object.assign({},ME.wear);WD.slot='outfit';showWardrobe();},
  'wd-slot':b=>{WD.slot=b.dataset.s;showWardrobe(true);},
  'wd-pick':b=>{WD.pre[WD.slot]=b.dataset.id;showWardrobe(true);},
  'wd-wear':()=>wdWear(),
  ach:()=>showAch(),
  norot:()=>document.documentElement.classList.add('norot'),
  'bp-skip':b=>bpSkip(Number(b.dataset.i)),
  pass:()=>showPass(),
  'fin-next':()=>finNext(),
  'fin-ans':b=>finAns(Number(b.dataset.i)),
  'fin-skip':()=>{cancelAnimationFrame(FIN.raf);win();},
  mus:()=>{
    MUS.on=!MUS.on;try{localStorage.setItem('iq300-mus',MUS.on?'1':'0');}catch(e){}
    document.querySelectorAll('[data-act="mus"]').forEach(x=>{x.textContent='เพลง: '+(MUS.on?'เปิด':'ปิด');x.setAttribute('aria-pressed',String(MUS.on));});
    if(MUS.on)musUnlock();else musGo(null);
  },
  iq:()=>{const e=$('#iqmsg');iqN=(iqN+1)%IQ_LINES.length;if(e)e.textContent=IQ_LINES[iqN];sfx('pickup');ME.cnt.iq++;checkAch();}
};
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');
  if(!b||b.disabled)return;
  const f=ACT[b.dataset.act];
  if(f)f(b);
});
document.addEventListener('submit',e=>{
  const f=e.target.closest('[data-form]');
  if(!f)return;
  e.preventDefault();
  if(f.dataset.form==='seq'&&G.screen==='play')submitSeq();
  else if(f.dataset.form==='name')saveName(f.dataset.input);
  else if(f.dataset.form==='chat'){sendChat(f.querySelector('input'));}
});

showHome();initServices();
})();
