<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>IQ 300 แหกโรงบาล</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chonburi&family=IBM+Plex+Mono:wght@400;500;600&family=Sarabun:wght@400;500;600;700&display=swap">
<style>
/* แนวคิดเลย์เอาต์: แฟ้มผู้ป่วยแปะบนผนังโรงพยาบาล คอลัมน์เดียวชิดซ้าย การ์ดกระดาษเหลี่ยมมีแท็บ ตราประทับสีแดงคือจุดเด่นจุดเดียว */
:root{
  --wall:#d2dcce; --paper:#eef3ec; --ink:#15201a; --muted:#52665b; --line:#a5b6aa;
  --ctrl:#dfe8dc; --ctrl-hi:#cfdccb; --stamp:#bf2f28; --ok:#2b7a4b; --warn:#b9740c;
  --fluoro:#f1e56b; --bulb-off:#b8c5bb; --safe-cell:#c6dcc9; --watch:#d65a50;
  --font-display:'Chonburi','Sarabun',serif;
  --font-body:'Sarabun',system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --wall:#0f1713; --paper:#17231d; --ink:#e3ede6; --muted:#9bb0a3; --line:#34463d;
    --ctrl:#1f2f27; --ctrl-hi:#2a3e34; --stamp:#ff7468; --ok:#59c98a; --warn:#e0a13a;
    --fluoro:#ece172; --bulb-off:#2c3d34; --safe-cell:#1f3b2b; --watch:#b2433a; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --wall:#0f1713; --paper:#17231d; --ink:#e3ede6; --muted:#9bb0a3; --line:#34463d;
  --ctrl:#1f2f27; --ctrl-hi:#2a3e34; --stamp:#ff7468; --ok:#59c98a; --warn:#e0a13a;
  --fluoro:#ece172; --bulb-off:#2c3d34; --safe-cell:#1f3b2b; --watch:#b2433a; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0; background:var(--wall); color:var(--ink);
  font-family:var(--font-body); font-size:16px; line-height:1.65;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:20px 56px;
}
.wrap{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:20px;min-width:0}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:3px solid var(--stamp);outline-offset:2px}

/* ---------- hero ---------- */
.hero{display:flex;flex-direction:column;gap:6px;padding-top:8px}
.eyebrow{margin:0;font-size:.8rem;letter-spacing:.08em;color:var(--muted)}
h1{font-family:var(--font-display);font-weight:400;font-size:clamp(2.1rem,7vw,3.6rem);line-height:1.35;margin:0;text-wrap:balance}
.lede{margin:0;font-size:1.1rem;color:var(--muted);max-width:40ch;text-wrap:balance}

/* ---------- folder / card ---------- */
.folder{display:flex;flex-direction:column;min-width:0}
.ftab{align-self:flex-start;background:var(--ink);color:var(--paper);font-family:var(--font-mono);font-size:.78rem;letter-spacing:.06em;padding:4px 12px;max-width:100%}
.card{background:var(--paper);border:1px solid var(--line);border-radius:2px;padding:20px;min-width:0}
h2.h{font-family:var(--font-display);font-weight:400;font-size:1.5rem;line-height:1.45;margin:0 0 8px;text-wrap:balance}
h3{margin:0 0 8px;font-size:1.05rem}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:20px}
.cols>*{min-width:0}

dl.profile{margin:0;display:flex;flex-direction:column;gap:10px}
dl.profile>div{display:grid;grid-template-columns:7.5rem 1fr;gap:12px;align-items:baseline;border-bottom:1px dashed var(--line);padding-bottom:10px}
dl.profile>div:last-child{border-bottom:0;padding-bottom:0}
dl.profile dt{color:var(--muted);font-size:.9rem}
dl.profile dd{margin:0;min-width:0}
.iq{font-size:1.6rem;font-weight:600;line-height:1.2}

dl.howto{margin:0;display:flex;flex-direction:column;gap:12px}
dl.howto dt{font-weight:700}
dl.howto dd{margin:0;color:var(--muted)}

.mission{background:var(--ink);color:var(--paper);padding:20px;border-radius:2px;display:flex;flex-direction:column;gap:6px}
.mission .lbl{font-family:var(--font-mono);font-size:.78rem;letter-spacing:.1em;opacity:.8}
.mission p{margin:0;font-size:1.1rem;max-width:62ch}

/* ---------- modes ---------- */
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
.mode{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--paper);border:2px solid var(--ink);border-radius:2px;padding:14px;min-width:0}
.mode:hover:not(:disabled){background:var(--ctrl)}
.mode .mname{font-family:var(--font-display);font-size:1.25rem;line-height:1.4}
.mode .mdesc{font-size:.9rem;color:var(--muted);flex:1}
.mode .mstate{font-family:var(--font-mono);font-size:.75rem;letter-spacing:.04em}
.mode.locked{border-style:dashed;border-color:var(--line);background:transparent;opacity:.75}
.mode.locked .mname{color:var(--muted)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:8px 18px;border:2px solid var(--ink);border-radius:2px;background:var(--paper);font-weight:600}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn:hover:not(:disabled){background:var(--ctrl-hi);color:var(--ink)}
.btn.primary:hover:not(:disabled){background:var(--stamp);border-color:var(--stamp);color:#fff}
.btn:disabled{opacity:.45}
.btn.ghost{border-color:var(--line);font-weight:500}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:16px}

/* ---------- topbar ---------- */
.topbar{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;justify-content:space-between;font-size:.9rem}
.topbar .who{min-width:0}
.topbar .hn{font-family:var(--font-mono);font-size:.75rem;background:var(--ctrl-hi);padding:2px 7px;margin-right:6px}
.topbar .meta{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center}
.badge{background:var(--ink);color:var(--paper);padding:1px 10px;font-weight:600}
.lives{display:inline-flex;gap:4px;vertical-align:middle;font-family:var(--font-mono)}
.lives i{width:12px;height:12px;border:2px solid var(--ink);display:inline-block}
.lives i.on{background:var(--ink)}
.steps{display:flex;gap:4px;flex:1 1 100%}
.steps i{flex:1;height:6px;background:var(--ctrl-hi)}
.steps i.done{background:var(--ink)}
.steps i.cur{background:var(--stamp)}
.btn-link{background:none;border:0;padding:4px 0;text-decoration:underline;color:var(--muted)}

/* ---------- meter ---------- */
.meter-wrap{display:flex;flex-direction:column;gap:4px;margin-bottom:18px}
.mrow{display:flex;justify-content:space-between;align-items:baseline;font-weight:600}
.meter{position:relative;height:16px;border:2px solid var(--ink);background:var(--ctrl)}
.meter::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(25% - 1px),var(--ink) calc(25% - 1px) 25%);opacity:.35;pointer-events:none}
.fill{height:100%;width:0;transition:width .25s linear}
.fill.calm{background:var(--ok)} .fill.warn{background:var(--warn)} .fill.danger{background:var(--stamp)}
.mtime{font-size:.85rem;color:var(--muted)}

/* ---------- shared stage bits ---------- */
.obst{border-left:4px solid var(--stamp);padding:4px 0 4px 12px;margin:14px 0}
.obst .lbl{font-family:var(--font-mono);font-size:.75rem;letter-spacing:.1em;color:var(--stamp)}
.obst p{margin:0}
.story{margin:0 0 8px;max-width:62ch}
.rules{margin:12px 0 0;padding-left:1.2rem;color:var(--muted)}
.msg{min-height:1.65em;margin:10px 0 0;color:var(--stamp);font-weight:600}
.hintline{margin:10px 0 0;padding:8px 12px;background:var(--ctrl);border:1px dashed var(--line)}
.foot{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line);display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:stretch}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* sequence */
.seqmeta{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;color:var(--muted);font-size:.9rem;margin-bottom:10px}
.tiles{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 16px}
.tile{min-width:3.4rem;padding:10px 12px;text-align:center;font-family:var(--font-mono);font-size:1.4rem;font-weight:500;background:var(--ctrl);border:1px solid var(--line)}
.tile.q{border:2px dashed var(--stamp);color:var(--stamp);background:transparent}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.field{min-height:44px;width:min(100%,12rem);padding:6px 12px;border:2px solid var(--ink);border-radius:2px;background:var(--paper);font-family:var(--font-mono);font-size:1.2rem}

/* cameras */
.scroll{overflow-x:auto;margin:10px 0}
.camgrid{display:grid;grid-template-columns:5rem repeat(var(--T),minmax(26px,1fr));gap:2px;min-width:max-content;font-size:.8rem}
.camgrid .tk{text-align:center;color:var(--muted)}
.camgrid .cn{white-space:nowrap;padding-right:8px}
.cell{height:26px;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono)}
.cell.safe{background:var(--safe-cell)}
.cell.watch{background:var(--watch);color:#fff}
.cell.path{outline:3px solid var(--ink);outline-offset:-3px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.85rem;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;margin-right:6px;vertical-align:-1px}
.legend .w::before{background:var(--watch)} .legend .s::before{background:var(--safe-cell)}
ul.camrules{margin:8px 0;padding-left:1.2rem}
ul.camrules li{margin-bottom:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 14px}
.chip{min-width:44px;min-height:44px;border:2px solid var(--ink);border-radius:2px;background:var(--paper);font-size:1rem}
.chip.on{background:var(--ink);color:var(--paper)}
.chip.out{border-style:dashed;border-color:var(--line);color:var(--muted);text-decoration:line-through}

/* drawers */
.drawers{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:12px;margin:12px 0}
.drawer{position:relative;display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left;padding:30px 12px 12px;border:2px solid var(--ink);border-radius:2px;background:var(--ctrl);min-width:0}
.drawer::before{content:"";position:absolute;top:10px;left:12px;width:44px;height:8px;background:var(--ink);border-radius:1px}
.drawer:hover:not(:disabled){background:var(--ctrl-hi)}
.drawer .dl{font-family:var(--font-display);font-size:1.5rem;line-height:1.2}
.drawer .sign{font-size:.92rem;padding:6px 8px;background:var(--paper);border:1px solid var(--line);width:100%}
.drawer .st{font-family:var(--font-mono);font-size:.75rem;color:var(--stamp);min-height:1.2em}
.drawer.out{opacity:.5;border-style:dashed}
.drawer.out .sign{text-decoration:line-through}

/* lights */
.lights{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:8px;max-width:calc(var(--n) * 72px);margin:12px 0}
.bulb{aspect-ratio:1;max-width:100%;border:2px solid var(--ink);border-radius:50%;background:var(--bulb-off)}
.bulb.on{background:var(--fluoro);box-shadow:0 0 16px 2px var(--fluoro)}
.bulb.hint{outline:3px dashed var(--stamp);outline-offset:3px}
.lstat{display:flex;flex-wrap:wrap;gap:6px 20px;align-items:center}

/* code lock */
.hist{list-style:none;margin:8px 0 14px;padding:0;display:flex;flex-direction:column;gap:6px}
.hist li{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:6px 10px;background:var(--ctrl)}
.hist .digits{display:inline-flex;gap:6px}
.hist .digits b{min-width:2rem;text-align:center;background:var(--paper);border:1px solid var(--line);padding:1px 6px}
.hist .pegs{font-size:1.05rem;letter-spacing:.1em}
.slots{display:flex;gap:8px;margin:8px 0}
.slot{width:3.2rem;height:3.4rem;display:flex;align-items:center;justify-content:center;border:2px dashed var(--line);background:transparent;font-family:var(--font-mono);font-size:1.5rem}
.slot.filled{border:2px solid var(--ink);background:var(--paper)}
.pad{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 12px}
.key{width:48px;height:48px;border:2px solid var(--ink);border-radius:2px;background:var(--paper);font-size:1.15rem}
.key:hover:not(:disabled){background:var(--ctrl-hi)}
.key:disabled{opacity:.35}
.key.x{text-decoration:line-through;border-style:dashed}

/* result screens */
.result{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.result .lead{font-size:1.15rem;margin:0;max-width:56ch}
.stamp{display:inline-block;border:4px solid var(--stamp);color:var(--stamp);font-family:var(--font-display);font-size:clamp(1.8rem,8vw,3rem);line-height:1.4;padding:0 18px;transform:rotate(-5deg);animation:slam .35s ease-out}
.stamp.ok{border-color:var(--ok);color:var(--ok)}
@keyframes slam{from{transform:rotate(-5deg) scale(2);opacity:0}to{transform:rotate(-5deg) scale(1);opacity:1}}
.stats{display:flex;flex-wrap:wrap;gap:8px 24px;margin:4px 0}
.stats div{display:flex;flex-direction:column}
.stats b{font-family:var(--font-mono);font-size:1.4rem;line-height:1.3}
.unlock{border:2px solid var(--ok);padding:10px 14px;color:var(--ok);font-weight:700}
.nextmodes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:12px;width:100%}

/* ---------- โลกที่เดินได้ ---------- */
.goal{margin:0 0 10px;padding:8px 12px;background:var(--ctrl);border-left:4px solid var(--stamp);font-weight:600}
.canvaswrap{border:2px solid var(--ink);background:#1d2622;line-height:0}
#world{display:block;width:100%;height:auto}
.ctrls{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-top:12px}
.ctrls .kb{flex:1 1 200px;margin:0}
.dpad{display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(2,54px);gap:6px}
.dpad button{touch-action:none;user-select:none;-webkit-user-select:none;border:2px solid var(--ink);background:var(--paper);border-radius:2px;font-size:1.3rem;line-height:1;padding:0}
.dpad button:active{background:var(--ctrl-hi)}
.dpad .u{grid-column:2;grid-row:1}.dpad .l{grid-column:1;grid-row:2}.dpad .d{grid-column:2;grid-row:2}.dpad .r{grid-column:3;grid-row:2}
@media (hover:hover) and (pointer:fine){.dpad{display:none}}
.pz-head{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;margin-bottom:10px}
.wires{display:flex;flex-wrap:wrap;gap:12px;margin:12px 0}
.wire{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:76px;padding:12px 10px;border:2px solid var(--ink);border-radius:2px;background:var(--ctrl)}
.wire:hover:not(:disabled){background:var(--ctrl-hi)}
.wire .bar{width:16px;height:76px;border:2px solid var(--ink);border-radius:8px}
.wire .wn{font-weight:600}
.wire .st{font-family:var(--font-mono);font-size:.75rem;color:var(--stamp);min-height:1.2em}
.wire.out{opacity:.5;border-style:dashed}
.wire.out .bar{border-style:dashed}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.tab{min-height:44px;padding:6px 14px;border:2px solid var(--ink);border-radius:2px;background:var(--paper);font-weight:600}
.tab:hover{background:var(--ctrl)}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.board{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px;width:100%}
.board li{display:grid;grid-template-columns:2.4rem minmax(0,1fr) auto;gap:2px 10px;align-items:baseline;padding:8px 12px;background:var(--ctrl)}
.board li.me{outline:2px solid var(--stamp);outline-offset:-2px}
.board .rk{font-family:var(--font-mono);font-weight:600}
.board .nm{overflow-wrap:anywhere}
.board .tm{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-weight:600}
.board .sub{grid-column:2/4;font-size:.8rem;color:var(--muted)}
.racehud{background:var(--paper);border:1px solid var(--line);padding:10px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.rhead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.rrow{display:grid;grid-template-columns:minmax(0,9rem) minmax(0,1fr) 4.8rem;gap:10px;align-items:center;font-size:.9rem}
.rrow.me{font-weight:700}
.rname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rbar{display:flex;gap:3px}
.rbar i{flex:1;height:8px;background:var(--ctrl-hi)}
.rbar i.done{background:var(--ink)}
.rbar i.cur{background:var(--stamp)}
.rms{text-align:right;font-variant-numeric:tabular-nums}
.countdown{font-family:var(--font-display);font-size:clamp(5rem,28vw,10rem);line-height:1.2;color:var(--stamp)}
.roomcode{font-family:var(--font-mono);font-size:clamp(2rem,10vw,3.4rem);letter-spacing:.3em;font-weight:600;background:var(--ctrl);padding:6px 16px;display:inline-block}
.roomlist{list-style:none;margin:8px 0 14px;padding:0;display:flex;flex-direction:column;gap:6px}
.roomlist li{padding:8px 12px;background:var(--ctrl);display:flex;justify-content:space-between;gap:10px}

/* ---------- ห้องโถงพยาบาล / ห้องเล่นกับเพื่อน / แชต ---------- */
.bigplay{display:flex;margin:14px 0 4px}
.btn.big{font-family:var(--font-display);font-size:clamp(1.6rem,6vw,2.4rem);padding:16px 48px;letter-spacing:.04em;min-width:min(100%,17rem);min-height:64px}
.modechips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.chip{border:2px solid var(--ink);background:var(--paper);color:var(--ink);padding:8px 14px;border-radius:2px;font-weight:600;min-height:44px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.chip:disabled{border-style:dashed;opacity:.55}
.wards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,140px),1fr));gap:10px}
.ward{display:flex;flex-direction:column;gap:2px;text-align:left;border:2px solid var(--ink);background:var(--paper);color:var(--ink);padding:12px;border-radius:2px;min-height:64px}
.ward b{font-family:var(--font-display);font-size:1.35rem;line-height:1.3}
.ward span{font-size:.82rem;color:var(--muted)}
.ward:disabled{opacity:.55;border-style:dashed}
.ward:hover:not(:disabled){background:var(--ctrl)}
.chat{display:flex;flex-direction:column;gap:8px;min-width:0}
.clog{border:1px solid var(--line);background:var(--ctrl);height:12rem;overflow-y:auto;padding:8px 10px;font-size:.95rem;display:flex;flex-direction:column;gap:3px}
.clog p{margin:0;overflow-wrap:anywhere}
.clog .me b{color:var(--ok)}
.clog .hid{color:var(--muted);font-style:italic}
.chat .row .field{flex:1;min-width:0;width:auto}
.chatsheet{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--paper);border-top:3px solid var(--ink);padding:8px 12px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -6px 18px rgba(0,0,0,.25)}
.chatsheet[hidden]{display:none}
.chatsheet .sheethead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.chatsheet .clog{height:min(9rem,26vh)}
.cbadge{font-weight:700}
.chatbig{min-height:56px;padding:10px 26px;font-size:1.2rem;font-weight:700;background:#ffd23f;color:#15201a;border-color:#15201a;flex:1 1 9rem}
.chatbtn{min-height:44px;padding:6px 14px;font-weight:700;background:#ffd23f;color:#15201a;border-color:#15201a}
.chatbig.new,.chatbtn.new{background:#ff5a3c;color:#fff;animation:chatpulse 1s ease-in-out infinite}
@keyframes chatpulse{50%{box-shadow:0 0 0 7px rgba(255,90,60,.4)}}
@media (prefers-reduced-motion:reduce){.chatbig.new,.chatbtn.new{animation:none}}
@media (orientation:landscape) and (max-height:540px){.chatsheet{left:auto;width:min(100%,26rem);right:0}.chatsheet .clog{height:min(6rem,24vh)}}
/* ---------- ลูกเล่น / โหมดคลั่ง ---------- */

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* ===== ตั้งค่า Supabase: แก้แค่สองบรรทัดนี้ (ดูวิธีหาค่าใน README.md) ===== */
window.SUPABASE_CONFIG={
  url:'https://YOUR-PROJECT-REF.supabase.co',
  anonKey:'YOUR-ANON-PUBLIC-KEY'
};
</script>
<script>
/* ตัวแปลงให้เกมคุยกับ Supabase ได้ เมื่อเปิดนอก claude.ai (เช่น GitHub Pages)
   เกมเรียก window.claude.use('user' | 'db' | 'room') ตัวนี้จึงจำลองสามอย่างนั้นด้วย Supabase */
(function(){
  var C=window.SUPABASE_CONFIG||{};
  if(window.claude)return;
  if(!window.supabase||!window.supabase.createClient){console.warn('[IQ300] โหลด supabase-js ไม่สำเร็จ เกมจะเล่นคนเดียวได้อย่างเดียว');return;}
  if(!C.url||!C.anonKey||String(C.url).indexOf('YOUR-')>=0||String(C.anonKey).indexOf('YOUR-')>=0){
    console.warn('[IQ300] ยังไม่ได้ใส่ SUPABASE_CONFIG ลีดเดอร์บอร์ดและห้องแข่งจะยังใช้ไม่ได้');return;
  }
  var sb=window.supabase.createClient(C.url,C.anonKey,{auth:{persistSession:true,autoRefreshToken:true},realtime:{params:{eventsPerSecond:10}}});
  var uidP=null;
  function getUid(){
    if(!uidP){
      uidP=(async function(){
        var r=await sb.auth.getSession();
        if(r&&r.data&&r.data.session&&r.data.session.user)return r.data.session.user.id;
        var s=await sb.auth.signInAnonymously();
        if(s.error)throw s.error;
        return s.data.user.id;
      })();
      uidP.catch(function(){uidP=null;});
    }
    return uidP;
  }

  var user={
    id:function(){return getUid();},
    isOwner:async function(){return false;},
    canEdit:async function(){return false;},
    can:async function(){return false;}
  };

  var db={
    doc:function(path){
      var parts=String(path).split('/'),id=parts[1];
      return {
        set:async function(data){
          var uid=await getUid();
          if(id!==uid)throw new Error('forbidden');
          var name=String((data&&data.name)||'').slice(0,16);
          var r=await sb.from('players').upsert({id:uid,name:name,data:data,updated_at:new Date().toISOString()});
          if(r.error)throw r.error;
        }
      };
    },
    collection:function(){
      return {
        limit:function(n){
          return {
            onSnapshot:function(next,err){
              var stopped=false,busy=false,okOnce=false,timer=null;
              async function load(){
                if(stopped||busy)return;
                busy=true;
                try{
                  var r=await sb.from('players').select('id,name,data').limit(n);
                  if(r.error)throw r.error;
                  okOnce=true;
                  var docs=(r.data||[]).map(function(row){
                    var d=Object.assign({},row.data||{});
                    d.name=row.name||d.name||'';
                    return {id:row.id,exists:true,data:function(){return d;}};
                  });
                  if(!stopped)next({docs:docs,size:docs.length,empty:!docs.length});
                }catch(e){
                  if(!okOnce&&!stopped&&err)err(e);
                }
                busy=false;
              }
              var onRefresh=function(){load();};
              window.addEventListener('iq300-refresh',onRefresh);
              timer=setInterval(function(){if(!document.hidden)load();},15000);
              load();
              return function(){stopped=true;clearInterval(timer);window.removeEventListener('iq300-refresh',onRefresh);};
            }
          };
        }
      };
    }
  };

  var room={
    noLobby:true,
    presence:async function(){throw new Error('no lobby');},
    peers:function(){return [];},
    onPeers:function(){return function(){};},
    join:async function(name){
      var uid;
      try{uid=await getUid();}catch(e){uid='anon';}
      var key=uid+':'+Math.random().toString(36).slice(2,8);
      var ch=sb.channel('room-'+name,{config:{presence:{key:key}}});
      var mine={},handlers=[];
      function peersList(){
        var st=ch.presenceState(),out=[];
        Object.keys(st).forEach(function(k){
          var metas=st[k]||[],m=metas[metas.length-1]||{},pr=Object.assign({},m);
          delete pr.presence_ref;
          out.push({peer:k,kind:'viewer',sameTab:k===key,isMe:k.split(':')[0]===uid,guest:false,presence:pr});
        });
        return out;
      }
      function emit(){
        var arr=peersList();
        handlers.slice().forEach(function(h){try{h({peers:arr,joined:[],left:[],updated:[]});}catch(e){console.error(e);}});
      }
      ch.on('presence',{event:'sync'},emit);
      await new Promise(function(res,rej){
        var t=setTimeout(function(){rej(new Error('timeout'));},10000);
        ch.subscribe(function(status){
          if(status==='SUBSCRIBED'){clearTimeout(t);res();}
          else if(status==='CHANNEL_ERROR'||status==='TIMED_OUT'||status==='CLOSED'){clearTimeout(t);rej(new Error(String(status)));}
        });
      }).catch(function(e){try{sb.removeChannel(ch);}catch(x){}throw e;});
      await ch.track(mine);
      return {
        name:name,
        presence:async function(patch){
          Object.keys(patch||{}).forEach(function(k){if(patch[k]===null)delete mine[k];else mine[k]=patch[k];});
          await ch.track(Object.assign({},mine));
        },
        peers:peersList,
        onPeers:function(h){handlers.push(h);setTimeout(emit,0);return function(){handlers=handlers.filter(function(x){return x!==h;});};},
        leave:async function(){handlers=[];try{await sb.removeChannel(ch);}catch(e){}}
      };
    }
  };

  window.claude={use:async function(n){
    if(n==='user')return user;
    if(n==='db')return db;
    if(n==='room')return room;
    throw new Error('unsupported: '+n);
  }};
})();
</script>

];
function genSeqs(cfg){
  const pool=shuffle(SEQ_GENS.filter(g=>g.t<=cfg.tier&&g.t>=Math.max(1,cfg.tier-1)));
  const items=[];
  for(let i=0;i<cfg.count;i++){
    const g=pool[i%pool.length];
    const terms=g.make()(cfg.shown+1);
    items.push({shown:terms.slice(0,cfg.shown),answer:terms[cfg.shown],hint:g.hint,hintOn:false});
  }
  return items;
}

function camWatching(c,t){return t>=c.f&&((t-c.f)%c.p)<c.w;}
function camValidStarts(cams,T){
  const n=cams.length,res=[];
  for(let s=0;s<=T-n;s++){let ok=true;for(let i=0;i<n;i++){if(camWatching(cams[i],s+i)){ok=false;break;}}if(ok)res.push(s);}
  return res;
}
function genCam(cfg){
  const n=cfg.n,T=cfg.T;
  let best=null;
  for(let tries=0;tries<4000;tries++){
    const cams=[];
    for(let i=0;i<n;i++){const p=rnd(3,6);const w=rnd(1,Math.min(3,p-1));cams.push({p,w,f:rnd(0,p-1)});}
    const valid=camValidStarts(cams,T);
    if(valid.length===1)return {cams,T,valid};
    if(valid.length>=1&&!best)best={cams,T,valid};
  }
  return best;
}

function keyTruth(s,i,p){
  switch(s.k){case'here':return p===i;case'nothere':return p!==i;case'in':return p===s.x;default:return p!==s.x;}
}
function stmtText(s,L){
  switch(s.k){
    case'here':return'กุญแจอยู่ในลิ้นชักนี้';
    case'nothere':return'กุญแจไม่ได้อยู่ในลิ้นชักนี้';
    case'in':return'กุญแจอยู่ในลิ้นชัก '+L[s.x];
    default:return'กุญแจไม่ได้อยู่ในลิ้นชัก '+L[s.x];
  }
}
function genKey(cfg){
  const n=cfg.n,L='ABCDE'.slice(0,n).split('');
  const target=cfg.rule==='one'?1:cfg.rule==='two'?2:n-1;
  const kinds=['here','nothere','in','notin'];
  for(let tries=0;tries<40000;tries++){
    const st=[];
    for(let i=0;i<n;i++){const k=pick(kinds);let x=null;if(k==='in'||k==='notin'){do{x=rnd(0,n-1);}while(x===i);}st.push({k,x});}
    const sols=[];
    for(let p=0;p<n;p++){let c=0;for(let i=0;i<n;i++)if(keyTruth(st[i],i,p))c++;if(c===target)sols.push(p);}
    if(sols.length===1){
      const ruleText=target===1?'ในป้ายทั้งหมด มีป้ายที่พูดจริงเพียง 1 ป้าย ที่เหลือโกหกหมด'
        :target===2?'ในป้ายทั้งหมด มีป้ายที่พูดจริงเพียง 2 ป้าย ที่เหลือโกหกหมด'
        :'ในป้ายทั้งหมด มีป้ายที่โกหกเพียง 1 ป้าย ที่เหลือพูดจริงทุกป้าย';
      return {n,L,st,answer:sols[0],ruleText};
    }
  }
  return cfg.rule==='one'?null:genKey({n:cfg.n,rule:'one'});
}

function lightsPress(board,size,i){
  const r=Math.floor(i/size),c=i%size;
  const t=(rr,cc)=>{if(rr<0||cc<0||rr>=size||cc>=size)return;board[rr*size+cc]=!board[rr*size+cc];};
  t(r,c);t(r-1,c);t(r+1,c);t(r,c-1);t(r,c+1);
}
function genLights(cfg){
  const n=cfg.size*cfg.size;
  let last=null;
  for(let tries=0;tries<300;tries++){
    const cells=shuffle(Array.from({length:n},(_,i)=>i)).slice(0,cfg.k);
    const board=Array(n).fill(false);
    cells.forEach(i=>lightsPress(board,cfg.size,i));
    last={size:cfg.size,board,init:board.slice(),solution:cells,limit:cfg.k+cfg.slack};
    if(board.filter(Boolean).length>=3)return last;
  }
  return last;
}

const WIRE_COLORS=[{n:'แดง',c:'#d94a3d'},{n:'น้ำเงิน',c:'#3d6fd9'},{n:'เขียว',c:'#2fa35b'},{n:'เหลือง',c:'#e3b82a'},{n:'ขาว',c:'#e8ece9'},{n:'ม่วง',c:'#8a56c2'}];
function wireOk(c,p,order){
  const q=order.indexOf(c.x);
  switch(c.k){case'not':return order[p]!==c.x;case'left':return p<q;case'right':return p>q;default:return Math.abs(p-q)===1;}
}
function wireText(c){
  const nm=WIRE_COLORS[c.x].n;
  switch(c.k){case'not':return'สายที่ต้องตัดไม่ใช่สี'+nm;case'left':return'สายที่ต้องตัดอยู่ทางซ้ายของสายสี'+nm;case'right':return'สายที่ต้องตัดอยู่ทางขวาของสายสี'+nm;default:return'สายที่ต้องตัดอยู่ติดกับสายสี'+nm;}
}
function genWires(n){
  for(let tries=0;tries<5000;tries++){
    const order=shuffle([0,1,2,3,4,5]).slice(0,n),ans=rnd(0,n-1),clues=[];
    for(let k=0;k<6&&clues.length<4;k++){
      const c={k:pick(['not','left','right','next']),x:pick(order)};
      if(!wireOk(c,ans,order))continue;
      clues.push(c);
      const sols=[];for(let p=0;p<n;p++)if(clues.every(cl=>wireOk(cl,p,order)))sols.push(p);
      if(sols.length===1)return {order,ans,clues:clues.map(wireText)};
    }
  }
  return null;
}
function mmFeedback(code,guess){
  let b=0,c=0;
  guess.forEach((d,i)=>{if(code[i]===d)b++;else if(code.includes(d))c++;});
  return {b,c};
}
function genCode(cfg){
  const pool=[];for(let d=cfg.min;d<=cfg.max;d++)pool.push(d);
  return {len:cfg.len,pool,code:shuffle(pool).slice(0,cfg.len),max:cfg.guesses};
}

const TQ=[];let tBusy=false;
function toast(a){TQ.push(a);if(!tBusy)nextToast();}
function nextToast(){
  const a=TQ.shift();
  if(!a){tBusy=false;return;}
  tBusy=true;
  let el=document.getElementById('toast');
  if(!el){el=document.createElement('div');el.id='toast';el.setAttribute('role','status');el.setAttribute('aria-live','polite');document.body.appendChild(el);}
  el.innerHTML='<b>'+esc(a.tag||'เหรียญใหม่')+' '+esc(a.name)+'</b>'+(a.r?' <span class="mono">+'+a.r+' ชาม</span>':'')+(a.xp?' <span class="mono">+'+a.xp+' XP</span>':'')+'<small>'+esc(a.fun||'')+'</small>';
  el.className='show';
  setTimeout(()=>{el.className='';setTimeout(nextToast,300);},3800);
}
function checkAch(ctx){
  let again=true,n=0;
  while(again&&n++<5){
    again=false;
    for(const a of ACH){
      if(ME.ach.includes(a.id))continue;
      let ok=false;
      if(a.ev)ok=!!(ctx&&a.ev(ctx));
      else if(a.p){const v=a.p();ok=v[0]>=v[1];}
      if(!ok)continue;
      ME.ach=normAch(ME.ach.concat([a.id]));ME.bowls+=a.r;
      saveLocal();pushMe();toast(a);sfx('solve');again=true;
    }
  }
}

function bpDef(m){
  const d=BP_POOL[m[0]%BP_POOL.length],r=m[1]||0;
  const t=Math.ceil(d.t*(1+0.5*r)),xp=Math.round(d.xp*(1+0.25*r)/5)*5;
  const name=d.n.indexOf('{t}')>=0?d.n.replace('{t}',t):(t>1?d.n+' '+t+' ครั้ง':d.n);
  return {k:d.k,t:t,xp:xp,name:name};
}
function bpNew(bp){
  for(let g=0;g<=BP_POOL.length;g++){
    const i=bp.nx%BP_POOL.length,r=Math.floor(bp.nx/BP_POOL.length);
    bp.nx++;
    if(!bp.a.some(m=>m&&m[0]===i))return [i,r,0];
  }
  const i=bp.nx%BP_POOL.length,r=Math.floor(bp.nx/BP_POOL.length);bp.nx++;return [i,r,0];
}
function bpFill(bp){while(bp.a.length<3)bp.a.push(bpNew(bp));}
function bpRewardText(r){
  const a=[];
  if(r.b)a.push('ชามก๋วยเตี๋ยว '+r.b+' ชาม');
  if(r.item){const it=itemOf(r.item[0],r.item[1]),sl=SLOTS.find(x=>x[0]===r.item[0]);a.push((it?it.name:'')+' ('+(sl?sl[1]:'')+')');}
  return a.join(' + ');
}
function bpGive(L){
  const r=BP_LV[L-1];if(!r)return;
  let txt=[];
  if(r.b){ME.bowls+=r.b;txt.push('ชามก๋วยเตี๋ยว '+r.b+' ชาม');}
  if(r.item){
    const sl=r.item[0],id=r.item[1],it=itemOf(sl,id);
    if(it){
      if(hasItem(sl,id)){ME.bowls+=it.price;txt.push(it.name+' ซ้ำ แปลงเป็น '+it.price+' ชาม');}
      else{ME.owned=normOwned(ME.owned.concat([sl+':'+id]));txt.push('ปลดล็อก '+it.name);}
    }
  }
  sfx('win');
  toast({tag:'เลเวลอัป เลเวล '+L,name:txt.join(' + '),fun:'รับรางวัลจากบัตรผ่านเรียบร้อย'});
  checkAch();
}
function bpXp(n,label,fun){
  const bp=ME.bp;bp.xp+=n;
  toast({tag:'ภารกิจสำเร็จ',name:label,xp:n,fun:fun||'ได้ XP เข้าบัตรผ่าน'});
  sfx('solve');
  while(bp.lv<BP_LV.length&&bp.xp>=bpNeed(bp.lv+1)){bp.lv++;bpGive(bp.lv);}
  saveLocal();
}
function bpLineHtml(){
  const bp=ME.bp;let best=null,bf=-1;
  bp.a.forEach(m=>{const d=bpDef(m),f=m[2]/d.t;if(f>bf){bf=f;best=[m,d];}});
  return best?'<b>ภารกิจ</b> '+esc(best[1].name)+' <span class="mono">'+best[0][2]+'/'+best[1].t+'</span>':'';
}
function updBpLine(){const e=document.getElementById('bpline');if(e)e.innerHTML=bpLineHtml();}
function bpAdd(k,n){
  n=n||1;const bp=ME.bp;let hit=false,done=false;
  bp.a.forEach(m=>{const d=bpDef(m);if(d.k===k&&m[2]<d.t){m[2]=Math.min(d.t,m[2]+n);hit=true;}});
  if(!hit)return;
  for(let i=0;i<bp.a.length;i++){
    const d=bpDef(bp.a[i]);
    if(bp.a[i][2]>=d.t){
      bp.a[i]=null;
      const nm=bpNew(bp);bp.a[i]=nm;
      bpXp(d.xp,d.name,'ภารกิจใหม่เด้งมาแล้ว : '+bpDef(nm).name);
      done=true;
    }
  }
  saveLocal();if(done)pushMe();
  updBpLine();
}
function bpSkip(i){
  const bp=ME.bp;if(!bp.a[i])return;
  bp.a[i]=null;bp.a[i]=bpNew(bp);
  saveLocal();sfx('pickup');
  showPass(i);
}

let W=null;

const solidCh=c=>c==='#'||c==='b'||c==='T'||c==='D';
const sightCh=c=>c==='#'||c==='b'||c==='D';
function chAt(x,y){if(!W||y<0||x<0||y>=W.rows||x>=W.cols)return '#';return W.grid[y][x];}
function solidAt(x,y){return solidCh(chAt(Math.floor(x),Math.floor(y)));}
function hitsWall(x,y){const r=0.28;return solidAt(x-r,y-r)||solidAt(x+r,y-r)||solidAt(x-r,y+r)||solidAt(x+r,y+r);}
function los(x0,y0,x1,y1){
  const dx=x1-x0,dy=y1-y0,d=Math.hypot(dx,dy),n=Math.max(2,Math.ceil(d/0.12));
  for(let k=1;k<n;k++){const x=x0+dx*k/n,y=y0+dy*k/n;if(sightCh(chAt(Math.floor(x),Math.floor(y))))return false;}
  return true;
}
const FOV=0.6; // ครึ่งมุมมอง (เรเดียน) ประมาณ 41 องศา
function guardSees(g,R){
  const dx=W.px-g.x,dy=W.py-g.y,d=Math.hypot(dx,dy);
  if(d>R)return false;
  if(d<0.05)return true;
  if((dx*g.fx+dy*g.fy)/d<Math.cos(FOV))return false;
  return los(g.x,g.y,W.px,W.py);
}
function moveGuard(g,dist){
  let left=dist,guard=0;
  while(left>1e-6&&guard++<8){
    let ni=g.i+g.dir;if(ni<0||ni>=g.pts.length){g.dir*=-1;ni=g.i+g.dir;}
    const tx=g.pts[ni][0],ty=g.pts[ni][1],dx=tx-g.x,dy=ty-g.y,d=Math.hypot(dx,dy);
    if(d<1e-6){g.i=ni;continue;}
    g.fx=dx/d;g.fy=dy/d;
    if(d<=left){g.x=tx;g.y=ty;g.i=ni;left-=d;}else{g.x+=g.fx*left;g.y+=g.fy*left;left=0;}
  }
}

function tone(f,d,type,v,at,f2){
  const t=AC.currentTime+(at||0),o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(f,t);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(v||.08,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02);
}
function noise(d,v,at){
  const n=Math.floor(AC.sampleRate*d),b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0);
  for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);
  const s=AC.createBufferSource(),g=AC.createGain();
  s.buffer=b;g.gain.value=v||.1;s.connect(g);g.connect(AC.destination);s.start(AC.currentTime+(at||0));
}

function musInit(){
  if(!AC||MUS.master)return;
  const cmp=AC.createDynamicsCompressor();
  cmp.threshold.value=-18;cmp.ratio.value=4;cmp.attack.value=.01;cmp.release.value=.2;
  const m=AC.createGain();m.gain.value=MUS.vol;m.connect(cmp);cmp.connect(AC.destination);MUS.master=m;
  const n=Math.floor(AC.sampleRate),b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0);
  for(let i=0;i<n;i++)a[i]=Math.random()*2-1;
  MUS.nb=b;
}
function mnote(f,t,d,type,v,o){
  o=o||{};
  const osc=AC.createOscillator(),g=AC.createGain(),a=o.a||.006,r=o.r||.05;
  osc.type=type;osc.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+a);
  if(!o.pluck)g.gain.setValueAtTime(v,t+Math.max(a,d));
  g.gain.exponentialRampToValueAtTime(.0001,t+d+r);
  if(o.lp){const fl=AC.createBiquadFilter();fl.type='lowpass';fl.frequency.value=o.lp;osc.connect(fl);fl.connect(g);}
  else osc.connect(g);
  if(o.pan&&AC.createStereoPanner){const pn=AC.createStereoPanner();pn.pan.value=o.pan;g.connect(pn);pn.connect(MUS.bus);}
  else g.connect(MUS.bus);
  osc.start(t);osc.stop(t+d+r+.03);
}
function mkick(t,v){
  const o=AC.createOscillator(),g=AC.createGain();
  o.type='sine';o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(42,t+.12);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+.18);
  o.connect(g);g.connect(MUS.bus);o.start(t);o.stop(t+.2);
}
function mnoise(t,d,v,hz,band){
  const sr=AC.createBufferSource(),g=AC.createGain(),f=AC.createBiquadFilter();
  sr.buffer=MUS.nb;f.type=band?'bandpass':'highpass';f.frequency.value=hz;
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  sr.connect(f);f.connect(g);g.connect(MUS.bus);sr.start(t,Math.random()*.5);sr.stop(t+d+.02);
}
function musStep(T,step,t,sd){
  const bar=Math.floor(step/16)%T.prog.length,s=step%16,ch=T.prog[bar],r=T.root+ch.r;
  if(s===0&&T.pad){CH_TONES[ch.q].forEach(x=>mnote(mf(r+x),t,sd*15,T.pad.w,T.pad.v,{a:.15,r:.4,lp:1400}));}
  const bv=T.bass&&T.bass.p[s];
  if(bv){let b=r-12;while(b>T.root-4)b-=12;mnote(mf(bv===1?b:bv===2?b+7:b+12),t,sd*1.8,T.bass.w,T.bass.v,{pluck:T.bass.pluck,lp:T.bass.lp,a:.004,r:.06});}
  const av=T.arp&&T.arp.p[s];
  if(av)mnote(mf(r+12+chordTone(ch.q,av)),t,sd*1.5,T.arp.w,T.arp.v,{pluck:1,a:.003,r:.08,pan:-.3});
  const md=T.mel&&T.mel.b[bar%T.mel.b.length][s];
  if(md){const sc=T.mel.sc,n=sc.length;mnote(mf(T.root+T.mel.o+sc[(md-1)%n]+12*Math.floor((md-1)/n)),t,sd*(T.mel.len||2),T.mel.w,T.mel.v,{pluck:T.mel.pluck,a:.005,r:.12,lp:T.mel.lp,pan:.25});}
  const d=T.dr;
  if(d){
    if(d.k&&d.k[s])mkick(t,.3*d.k[s]*(d.kv||1));
    if(d.s&&d.s[s]){mnoise(t,.14,.15*d.s[s],1800,1);mnote(190,t,.07,'triangle',.09,{pluck:1});}
    if(d.h&&d.h[s])mnoise(t,.035,.05*d.h[s]*(d.hv||1),7000,0);
  }
}

function musTheme(){
  const sc=G.screen;
  if(sc==='play'){
    if(G.mode==='race')return 'race';
    if(bossHere())return BOSSES[ST().boss||'small'].mus;
    if(G.mode==='rage')return 'rage';
    return 'sneak';
  }
  if(sc==='finale')return 'noodle';
  if(sc==='caught'||sc==='over'||sc==='countdown')return null;
  return 'lobby';
}
function musGo(id){
  if(!AC||!MUS.master){MUS.cur=null;return;}
  const now=AC.currentTime;
  if(MUS.bus){const old=MUS.bus;old.gain.cancelScheduledValues(now);old.gain.setTargetAtTime(.0001,now,.12);setTimeout(()=>{try{old.disconnect();}catch(e){}},1600);}
  MUS.cur=id;MUS.step=0;MUS.next=now+.08;
  if(id){const b=AC.createGain();b.gain.setValueAtTime(.0001,now);b.gain.linearRampToValueAtTime(MT[id].g||1,now+.25);b.connect(MUS.master);MUS.bus=b;}
  else MUS.bus=null;
}
function musTick(){
  if(!MUS.on||!AC||AC.state!=='running'||!MUS.master)return;
  const want=musTheme();
  if(want!==MUS.cur)musGo(want);
  if(!MUS.cur)return;
  const T=MT[MUS.cur];
  let bpm=T.bpm;if(T.mb)bpm*=T.mb[G.mode]||1;
  const sd=60/bpm/4;
  while(MUS.next<AC.currentTime+.35){musStep(T,MUS.step,MUS.next,sd);MUS.next+=sd;MUS.step++;}
  const duck=(G.screen==='play'&&W&&W.puzzleOpen)?.5:1;
  if(duck!==MUS.duck){MUS.duck=duck;MUS.master.gain.setTargetAtTime(MUS.vol*duck,AC.currentTime,.15);}
}
function musUnlock(){
  if(!MUS.on)return;
  try{
    if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;AC=new C();}
    if(AC.state==='suspended')AC.resume();
    musInit();
    if(!MUS.timer)MUS.timer=setInterval(musTick,90);
  }catch(e){}
}
['click','touchend','keydown'].forEach(ev=>document.addEventListener(ev,musUnlock,{passive:true}));

function confetti(){
  try{
    if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
    const cv=document.createElement('canvas');cv.setAttribute('aria-hidden','true');
    cv.style.cssText='position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:50';
    cv.width=window.innerWidth;cv.height=window.innerHeight;document.body.appendChild(cv);
    const c=cv.getContext('2d'),cols=['#e5484d','#f5a524','#3bb273','#3b82f6','#a855f7','#f1e56b'];
    const ps=Array.from({length:130},()=>({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.4,vx:(Math.random()-.5)*3,vy:2+Math.random()*4,s:5+Math.random()*6,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:cols[Math.floor(Math.random()*cols.length)]}));
    const t0=performance.now();
    const step=now=>{
      c.clearRect(0,0,cv.width,cv.height);
      ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.05;p.r+=p.vr;c.save();c.translate(p.x,p.y);c.rotate(p.r);c.fillStyle=p.c;c.fillRect(-p.s/2,-p.s/3,p.s,p.s*.6);c.restore();});
      if(now-t0<3200)requestAnimationFrame(step);else cv.remove();
    };
    requestAnimationFrame(step);
  }catch(e){}
}

function drawAura(c,x,y,id,t,front){
  if(id==='fire'&&!front){
    c.fillStyle='rgba(255,120,30,.22)';c.beginPath();c.arc(x,y-2,20,0,7);c.fill();
    for(let k=0;k<6;k++){
      const fx=x-15+k*6,h=8+5*Math.sin(t*10+k*2);
      c.fillStyle=k%2?'#ff7a1a':'#ffb21a';c.beginPath();c.moveTo(fx-3.5,y+12);c.lineTo(fx,y+12-h-8);c.lineTo(fx+3.5,y+12);c.fill();
    }
  }else if(id==='bolt'&&!front){
    c.fillStyle='rgba(255,225,77,'+(0.15+0.1*Math.sin(t*12))+')';c.beginPath();c.arc(x,y-2,22,0,7);c.fill();
  }else if(front&&id==='sparkle'){
    for(let k=0;k<5;k++){
      const a=t*2+k*1.26,px=x+Math.cos(a)*17,py=y-6+Math.sin(a)*15,z=1.6+Math.sin(t*6+k)*.8;
      c.fillStyle='#fff6a8';c.fillRect(px-z/2,py-z*2,z,z*4);c.fillRect(px-z*2,py-z/2,z*4,z);
    }
  }else if(front&&id==='noodle'){
    c.strokeStyle='#f1dc8a';c.lineWidth=2;c.lineCap='round';
    for(let k=0;k<3;k++){
      c.beginPath();
      for(let i=0;i<=12;i++){
        const a=t*1.5+k*2.09+i*.2,px=x+Math.cos(a)*18,py=y-4+Math.sin(a)*11+Math.sin(i+t*6)*1.5;
        if(i===0)c.moveTo(px,py);else c.lineTo(px,py);
      }
      c.stroke();
    }
    c.lineCap='butt';
  }else if(front&&id==='bolt'){
    if(Math.floor(t*6)%2){
      c.strokeStyle='#ffe14d';c.lineWidth=2;
      for(const sx of [-1,1]){c.beginPath();c.moveTo(x+sx*14,y-22);c.lineTo(x+sx*10,y-13);c.lineTo(x+sx*15,y-12);c.lineTo(x+sx*11,y-2);c.stroke();}
    }
  }
}

const isRage=()=>G.mode==='rage'||bossHere();
function say(o,text,dur){
  if(!W)return;
  W.bubbles=W.bubbles.filter(b=>b.o!==o);
  W.bubbles.push({o,text,t:dur||2.2});

  if(t){t.textContent='';const bb=document.createElement('b');bb.textContent=(o==='p'?'ธี':o==='cat'?'แมว':o.name)+': ';t.appendChild(bb);t.appendChild(document.createTextNode(text));}
}
function flood(fx,fy){
  const cols=W.cols,rows=W.rows,d=new Int16Array(cols*rows).fill(-1),q=[fx+fy*cols];
  d[q[0]]=0;
  for(let h=0;h<q.length;h++){
    const c=q[h],x=c%cols,y=(c/cols)|0;
    for(const a of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nx=x+a[0],ny=y+a[1];
      if(nx<0||ny<0||nx>=cols||ny>=rows)continue;
      const k=nx+ny*cols;
      if(d[k]>=0||solidCh(W.grid[ny][nx]))continue;
      d[k]=d[c]+1;q.push(k);
    }
  }
  return d;
}
function spawnBowls(){
  W.bowls=[];W.nb=0;W.got=0;
  if(G.mode==='race'||!W.T)return;
  const prior=Math.min(3,G.bowlDone[G.stage]||0);
  W.got=prior;
  const d=flood(Math.floor(W.px),Math.floor(W.py)),c=[];
  for(let y=0;y<W.rows;y++)for(let x=0;x<W.cols;x++){
    if(d[x+y*W.cols]>=3&&W.grid[y][x]==='.'&&Math.hypot(x-W.T[0],y-W.T[1])>1.6)c.push([x,y]);
  }
  for(let i=c.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=c[i];c[i]=c[j];c[j]=t;}
  const out=[];
  for(const p of c){if(out.length>=3-prior)break;if(out.every(o=>Math.hypot(o[0]-p[0],o[1]-p[1])>=4))out.push(p);}
  W.bowls=out.map(p=>({x:p[0]+.5,y:p[1]+.5,got:false}));W.nb=prior+W.bowls.length;
}
function chase(g,dist){
  const gx=Math.floor(g.x),gy=Math.floor(g.y);
  let tx=W.px,ty=W.py;
  const direct=Math.hypot(W.px-g.x,W.py-g.y)<2.2&&los(g.x,g.y,W.px,W.py);
  if(!direct&&W.dist){
    let best=W.dist[gx+gy*W.cols],bx=gx,by=gy;
    if(best>=0){
      for(const a of [[1,0],[-1,0],[0,1],[0,-1]]){
        const nx=gx+a[0],ny=gy+a[1];
        if(nx<0||ny<0||nx>=W.cols||ny>=W.rows)continue;
        const v=W.dist[nx+ny*W.cols];
        if(v>=0&&v<best){best=v;bx=nx;by=ny;}
      }
      tx=bx+.5;ty=by+.5;
    }
  }
  const dx=tx-g.x,dy=ty-g.y,d=Math.hypot(dx,dy);
  if(d<1e-6)return;
  const ux=dx/d,uy=dy/d,s=Math.min(dist,d);
  g.fx=ux;g.fy=uy;
  if(!hitsWall(g.x+ux*s,g.y))g.x+=ux*s;
  if(!hitsWall(g.x,g.y+uy*s))g.y+=uy*s;
}

function punch(){
  if(!W||G.screen!=='play'||W.puzzleOpen||!isRage()||W.cd>0)return;
  W.cd=W.raging>0?0.3:0.45;W.punchT=0.18;sfx('punch');ME.cnt.swings++;bpAdd('swings');

    const dx=g.x-W.px,dy=g.y-W.py,d=Math.hypot(dx,dy);

    g.hp-=dmg;g.hitT=0.25;alertGuard(g,true);

    if(!hitsWall(g.x,g.y+uy*kb))g.y+=uy*kb;
    if(W.raging<=0)W.rage=Math.min(100,W.rage+34);
    if(g.hp<=0){

function hurt(g){

function bossShoot(g){

    W.proj.push({x:g.x,y:g.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:4,k:g.kind});
  }
  sfx('punch');
}

     px:P[0]+.5,py:P[1]+.5,face:[0,1],walk:0,moving:false,cv,ctx:cv.getContext('2d'),keys:{},pad:{},last:performance.now(),raf:0,t:0,hp:5,mhp:5,inv:0,cd:0,punchT:0,rage:0,raging:0,flash:0,kos:0,got:0,nb:0,bowls:[],bubbles:[],dist:null,wsHtml:'',rageTold:false,catT:6+Math.random()*6,

       return {pts,i,dir,x:pts[i][0],y:pts[i][1],fx:dx/d,fy:dy/d,sees:false,hp:GH,mhp:GH,ko:false,alert:false,hitT:0,atkT:0,shoutT:0,was:false,chatT:4+Math.random()*6,name:GNAMES[gi%GNAMES.length]};

function loop(now){
  if(!W||G.screen!=='play')return;

  const dt=Math.min((now-W.last)/1000,0.05);W.last=now;W.t+=dt;

function updateWorld(dt){
  const m=mode(),gp=m.guard,S=G.S,rage=isRage();
  W.bubbles.forEach(b=>{b.t-=dt;});W.bubbles=W.bubbles.filter(b=>b.t>0);
  W.cd=Math.max(0,W.cd-dt);W.punchT=Math.max(0,W.punchT-dt);W.inv=Math.max(0,W.inv-dt);W.flash=Math.max(0,W.flash-dt);
  if(W.raging>0){
    W.raging-=dt;W.rage=Math.max(0,100*W.raging/RAGE_T);
    if(W.raging<=0){W.raging=0;W.rage=0;say('p','หมดแรงแล้ว ขอก๋วยเตี๋ยวหน่อย',2);}
  }
  let dx=(W.keys.r||W.pad.r?1:0)-(W.keys.l||W.pad.l?1:0);
  let dy=(W.keys.d||W.pad.d?1:0)-(W.keys.u||W.pad.u?1:0);
  W.moving=dx!==0||dy!==0;
  if(W.moving){
    const n=Math.hypot(dx,dy);dx/=n;dy/=n;W.face=[dx,dy];W.walk+=dt;
    const sp=4.2*(W.raging>0?1.5:1)*dt;
    if(!hitsWall(W.px+dx*sp,W.py))W.px+=dx*sp;
    if(!hitsWall(W.px,W.py+dy*sp))W.py+=dy*sp;
  }
  if(rage&&W.guards.some(g=>g.alert&&!g.ko))W.dist=flood(Math.floor(W.px),Math.floor(W.py));
  let seen=false;
  for(const g of W.guards){
    if(g.ko){g.sees=false;continue;}
    g.hitT=Math.max(0,g.hitT-dt);g.atkT=Math.max(0,g.atkT-dt);g.shoutT=Math.max(0,g.shoutT-dt);
    if(g.boss){chase(g,g.K.speed[g.phase-1]*dt);bossAI(g,dt);}
    else if(rage&&g.alert)chase(g,gp.chase*dt);else moveGuard(g,gp.speed*dt);
    g.sees=guardSees(g,gp.range);
    if(g.sees){
      seen=true;
      if(rage)alertGuard(g);
      else if(!g.was&&g.shoutT<=0&&G.mode!=='race'){say(g,rp(SPOT_SHOUTS),1.5);g.shoutT=4;}
    }
    g.was=g.sees;
    const dd=Math.hypot(W.px-g.x,W.py-g.y);
    if(rage){
      if(dd<(g.boss?g.K.reach:0.75)&&g.atkT<=0&&W.inv<=0&&W.raging<=0){if(hurt(g))return;}
    }else if(dd<0.5){caught('ยามเดินมาชนคุณพอดี แล้วพาตัวกลับห้องทันที');return;}
    if(!g.alert&&!g.sees&&G.mode!=='race'){
      g.chatT-=dt;
      if(g.chatT<=0){say(g,rp(GUARD_CHAT),2.6);g.chatT=8+Math.random()*8;}
    }
  }
  if(W.proj&&W.proj.length){
    for(const pr of W.proj){
      pr.x+=pr.vx*dt;pr.y+=pr.vy*dt;pr.life-=dt;
      if(solidAt(pr.x,pr.y))pr.life=0;
      else if(W.inv<=0&&W.raging<=0&&Math.hypot(W.px-pr.x,W.py-pr.y)<(pr.k==='big'?0.68:0.5)){pr.life=0;if(hurtP())return;}
    }
    W.proj=W.proj.filter(q=>q.life>0);
  }
  for(const b of W.bowls){
    if(b.got||Math.hypot(W.px-b.x,W.py-b.y)>=0.6)continue;
    b.got=true;W.got++;G.bowlDone[G.stage]=W.got;G.bowls++;ME.bowls++;saveLocal();sfx('pickup');checkAch();bpAdd('bowls');
    if(ME.wear.pet!=='none'&&Math.random()<.35)say('cat',rp(CAT_PICK),1.8);
    S.susp=Math.max(0,S.susp-12);updateMeter();
    if(rage&&W.hp<W.mhp)W.hp++;
    say('p',rp(PICKUP_QUIPS),2.2);
  }
  if(seen&&!rage){if(addSusp(gp.rate*dt))return;}
  else if(m.timeScale===0&&S.susp>0){S.susp=Math.max(0,S.susp-6*dt);updateMeter();}
  const near=!W.solved&&Math.hypot(W.px-(W.T[0]+.5),W.py-(W.T[1]+.5))<1.8;
  if(near!==W.near){W.near=near;const b=$('#useBtn');if(b)b.disabled=!near;}
  if(ME.wear.pet!=='none'&&G.mode!=='race'){W.catT-=dt;if(W.catT<=0){say('cat',rp(CAT_QUIPS),2.2);W.catT=14+Math.random()*10;}}
  updateWstat();
  if(W.doorOpen&&chAt(Math.floor(W.px),Math.floor(W.py))==='E'){clearStage();}
}

function drawWorld(){

    const c=W.grid[y][x],px=x*TS,py=y*TS;

      ctx.fillStyle=p.wall;ctx.fillRect(px,py,TS,TS);
      if(chAt(x,y+1)!=='#'){ctx.fillStyle=p.top;ctx.fillRect(px,py+TS-9,TS,9);}

    }

      ctx.fillStyle=p.furn;ctx.fillRect(px+2,py+2,TS-4,TS-7);

      ctx.fillStyle='#7a4b24';ctx.fillRect(px+3,py+1,TS-6,TS-2);
      ctx.fillStyle='#5a3416';for(let k=0;k<3;k++)ctx.fillRect(px+6,py+4+k*9,TS-12,3);
      ctx.fillStyle='#f0c43a';ctx.fillRect(px+11,py+12,10,9);
      ctx.strokeStyle='#f0c43a';ctx.lineWidth=2;ctx.beginPath();ctx.arc(px+16,py+12,4,Math.PI,0);ctx.stroke();
    }else if(c==='E'){
      ctx.fillStyle=W.doorOpen?'rgba(60,200,110,'+(0.5+0.35*pulse)+')':'rgba(60,200,110,.22)';
      ctx.fillRect(px,py,TS,TS);
      ctx.fillStyle=W.doorOpen?'#06311a':'#2f5a40';ctx.font='700 12px Sarabun,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText('ออก',px+TS/2,py+TS/2);
    }else if(c==='T'){
      ctx.fillStyle='rgba(0,0,0,.25)';ctx.fillRect(px+5,py+6,TS-6,TS-5);
      ctx.fillStyle='#1b2430';ctx.fillRect(px+3,py+3,TS-6,TS-6);
      ctx.fillStyle=W.solved?'#3be38a':'rgba(90,200,255,'+(0.55+0.45*pulse)+')';ctx.fillRect(px+7,py+7,TS-14,TS-17);
      ctx.fillStyle='#46566b';ctx.fillRect(px+7,py+TS-9,TS-14,3);
    }
  }
  // ชามก๋วยเตี๋ยว
  for(const b of W.bowls){
    if(b.got)continue;
    const x=b.x*TS,y=b.y*TS+Math.sin(W.t*3+b.x)*2;
    ctx.fillStyle='rgba(255,220,120,'+(0.28+0.12*pulse)+')';ctx.beginPath();ctx.arc(x,y,15+2*pulse,0,7);ctx.fill();
    ctx.fillStyle='rgba(0,0,0,.22)';ctx.beginPath();ctx.ellipse(x,y+10,9,3,0,0,7);ctx.fill();
    ctx.fillStyle='#f4f1e6';ctx.beginPath();ctx.arc(x,y,10,0,Math.PI);ctx.closePath();ctx.fill();
    ctx.strokeStyle='#c0392b';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,10,0.15,Math.PI-0.15);ctx.stroke();
    ctx.fillStyle='#e3a64a';ctx.beginPath();ctx.ellipse(x,y,10,3.5,0,0,7);ctx.fill();
    ctx.strokeStyle='#f6e6a8';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(x-5,y);ctx.quadraticCurveTo(x-2,y-6,x+1,y-1);ctx.quadraticCurveTo(x+3,y-5,x+6,y);ctx.stroke();
    ctx.strokeStyle='#8a5a2b';ctx.beginPath();ctx.moveTo(x+4,y-3);ctx.lineTo(x+13,y-12);ctx.moveTo(x+7,y-2);ctx.lineTo(x+15,y-9);ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,.75)';
    for(let k=0;k<2;k++){ctx.beginPath();ctx.moveTo(x-4+k*7,y-6);ctx.bezierCurveTo(x-7+k*7,y-10,x-1+k*7,y-13,x-4+k*7,y-17);ctx.stroke();}
  }
  // กรวยสายตา
  const gp=mode().guard;
  for(const g of W.guards){
    if(g.ko||g.boss)continue;
    const a0=Math.atan2(g.fy,g.fx);
    ctx.beginPath();ctx.moveTo(g.x*TS,g.y*TS);
    for(let k=0;k<=18;k++){
      const a=a0-FOV+2*FOV*k/18,cx=Math.cos(a),cy=Math.sin(a);let d=0;
      while(d<gp.range){const nd=d+0.12;if(sightCh(chAt(Math.floor(g.x+cx*nd),Math.floor(g.y+cy*nd))))break;d=nd;}
      ctx.lineTo((g.x+cx*d)*TS,(g.y+cy*d)*TS);
    }
    ctx.closePath();ctx.fillStyle=(g.sees||g.alert)?'rgba(255,40,30,.42)':'rgba(255,200,60,.22)';ctx.fill();
  }
  // ยาม
  for(const g of W.guards){
    if(g.boss){drawBoss(ctx,g);continue;}
    const x=g.x*TS,y=g.y*TS;
    if(g.ko){
      ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(x,y+9,14,4,0,0,7);ctx.fill();
      ctx.save();ctx.translate(x,y+4);ctx.rotate(Math.PI/2);
      ctx.fillStyle='#1f2b45';ctx.fillRect(-8,-8,16,17);
      ctx.fillStyle='#e8c9a4';ctx.beginPath();ctx.arc(0,-12,7,0,7);ctx.fill();
      ctx.fillStyle='#c43a30';ctx.fillRect(-8,-20,16,6);
      ctx.strokeStyle='#15171c';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(-4,-14);ctx.lineTo(-1,-11);ctx.moveTo(-1,-14);ctx.lineTo(-4,-11);ctx.moveTo(1,-14);ctx.lineTo(4,-11);ctx.moveTo(4,-14);ctx.lineTo(1,-11);ctx.stroke();
      ctx.restore();
      ctx.fillStyle='#f0c43a';
      for(let k=0;k<3;k++){const a=W.t*3+k*2.1;ctx.fillRect(x+12+Math.cos(a)*9-1.5,y-8+Math.sin(a)*3-1.5,3,3);}
      continue;
    }
    const bob=Math.sin(W.t*8+g.x)*1.5;
    ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(x,y+11,10,4,0,0,7);ctx.fill();
    ctx.fillStyle=g.hitT>0?'#ffffff':'#1f2b45';ctx.fillRect(x-8,y-8+bob,16,17);
    ctx.fillStyle='#e8c9a4';ctx.beginPath();ctx.arc(x,y-12+bob,7,0,7);ctx.fill();
    ctx.fillStyle='#c43a30';ctx.fillRect(x-8,y-20+bob,16,6);
    ctx.fillStyle='#15171c';ctx.fillRect(x+g.fx*3-3,y-12+bob+g.fy*2,2,3);ctx.fillRect(x+g.fx*3+2,y-12+bob+g.fy*2,2,3);
    ctx.fillStyle='#f0c43a';ctx.fillRect(x-3,y-3+bob,6,4);
    if(g.mhp>0){
      for(let k=0;k<g.mhp;k++){ctx.fillStyle=k<g.hp?'#e5484d':'#555';ctx.fillRect(x-g.mhp*4+k*8+1,y-28,6,4);}
    }
    if(g.sees||g.alert){ctx.fillStyle=g.alert?'#ff8a1f':'#ff3b2e';ctx.font='700 20px Sarabun,sans-serif';ctx.textAlign='center';ctx.textBaseline='alphabetic';ctx.fillText('!',x,y-31);}
  }
  drawProj(ctx);
  drawGhosts(ctx);
  // ผู้เล่น
  const x=W.px*TS,y=W.py*TS,sw=W.moving?Math.sin(W.walk*14)*4:0;
  ctx.save();
  if(W.inv>0&&W.raging<=0&&Math.floor(W.t*20)%2)ctx.globalAlpha=.4;
  if(W.raging>0){
    const r=24+3*Math.sin(W.t*18),gr=ctx.createRadialGradient(x,y-2,4,x,y-2,r);
    gr.addColorStop(0,'rgba(255,60,40,.6)');gr.addColorStop(1,'rgba(255,60,40,0)');
    ctx.fillStyle=gr;ctx.beginPath();ctx.arc(x,y-2,r,0,7);ctx.fill();
  }
  drawHero(ctx,x,y,{wear:ME.wear,fx:W.face[0],fy:W.face[1],sw,t:W.t,eyes:W.face[1]<=0.5,rage:W.raging>0});
  if(W.punchT>0){
    const k=1-W.punchT/0.18,fx=x+W.face[0]*(10+k*14),fy=y-2+W.face[1]*(10+k*10),ang=Math.atan2(W.face[1],W.face[0]);
    ctx.fillStyle=W.raging>0?'#ff5a3c':'#f0cfa8';ctx.beginPath();ctx.arc(fx,fy,5.5,0,7);ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y-2,24,ang-0.6,ang+0.6);ctx.stroke();
  }
  ctx.restore();
  // ปุ่มบอกให้กด E
  if(W.near&&!W.solved){
    const tx=(W.T[0]+.5)*TS,ty=W.T[1]*TS-8;
    ctx.fillStyle='#fff';ctx.strokeStyle='#15201a';ctx.lineWidth=2;
    ctx.beginPath();ctx.rect(tx-11,ty-12,22,22);ctx.fill();ctx.stroke();
    ctx.fillStyle='#15201a';ctx.font='700 15px IBM Plex Mono,monospace';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('E',tx,ty-1);
  }
  // ข้อความลอย
  ctx.textAlign='left';ctx.textBaseline='middle';
  for(const b of W.bubbles){
    const bx=b.o==='p'?W.px*TS:b.o==='cat'?W.px*TS+26:b.o.x*TS,by=b.o==='p'?W.py*TS-32:b.o==='cat'?W.py*TS-20:b.o.y*TS-(b.o.boss?58:38);
    ctx.font='700 16px Sarabun,sans-serif';
    const tw=Math.min(ctx.measureText(b.text).width,W.cols*TS-28),w=tw+16,h=24;
    const x0=Math.max(4,Math.min(W.cols*TS-w-4,bx-w/2)),y0=Math.max(4,by-h);
    ctx.globalAlpha=Math.min(1,b.t/0.4);
    ctx.fillStyle='#ffffff';ctx.strokeStyle='#15201a';ctx.lineWidth=2;
    ctx.beginPath();ctx.rect(x0,y0,w,h);ctx.fill();ctx.stroke();
    const ax=Math.max(x0+8,Math.min(x0+w-8,bx));
    ctx.beginPath();ctx.moveTo(ax-5,y0+h);ctx.lineTo(ax,y0+h+6);ctx.lineTo(ax+5,y0+h);ctx.closePath();ctx.fill();ctx.stroke();
    ctx.fillStyle='#ffffff';ctx.fillRect(ax-4,y0+h-1,8,3);
    ctx.fillStyle='#15201a';ctx.fillText(b.text,x0+8,y0+h/2+1,tw);
    ctx.globalAlpha=1;
  }
  if(W.flash>0){ctx.fillStyle='rgba(229,72,77,'+Math.min(.5,W.flash*1.6)+')';ctx.fillRect(0,0,W.cols*TS,W.rows*TS);}
  drawBossBar(ctx);
}

  if(G.race){G.race.coop=false;setSc('idle');}
  G.mode=id;G.stage=0;G.lives=MODES[id].lives;G.caught=0;G.hints=0;G.playTime=0;G.kos=0;G.bowls=0;G.bowlDone={};

}

function beginStage(){

  if(pt===0){S.seq={items:genSeqs(m.seq),cur:0};}
  if(pt===1){S.cam=genCam(m.cam);S.sel=null;S.out=new Set();}

  renderStage();updateMeter();startTimer();initWorld();updBpLine();
  window.scrollTo(0,0);
}

/* ---------- ตัวจับเวลาและมาตรวัด ---------- */
function stopTimer(){if(G.timer){clearInterval(G.timer);G.timer=null;}if(W&&W.raf){cancelAnimationFrame(W.raf);W.raf=0;}}
function startTimer(){stopTimer();G.last=performance.now();G.timer=setInterval(tick,250);}
function tick(){
  const rc=$('#racetime');if(rc&&G.race&&G.race.t0&&G.race.ms==null)rc.textContent=fmtMs(performance.now()-G.race.t0);
  const now=performance.now(),dt=Math.min(now-G.last,600)/1000;G.last=now;
  const S=G.S;if(!S||G.screen!=='play')return;
  G.playTime+=dt;
  const m=mode();
  if(m.timeScale>0&&!bossHere())S.susp=Math.min(100,S.susp+dt*100/(BASE[SI()]*m.timeScale));
  updateMeter();
  if(S.susp>=100)caught();
}
function updateMeter(){
  const S=G.S,f=$('#mfill');if(!S||!f)return;
  const v=Math.min(100,S.susp);
  f.style.width=v+'%';
  f.className='fill '+(v>=80?'danger':v>=50?'warn':'calm');
  $('#mnum').textContent=Math.floor(v)+'%';
  $('#meter').setAttribute('aria-valuenow',String(Math.floor(v)));
  const m=mode(),t=$('#mtime');
  if(t){
    if(m.timeScale>0&&!bossHere()){const rate=100/(BASE[SI()]*m.timeScale);t.textContent='ยามมาถึงในอีกประมาณ '+Math.max(0,Math.ceil((100-v)/rate))+' วินาที';}
    else t.textContent='ไม่จับเวลา';
  }
}
function addSusp(n){
  const S=G.S;S.susp=Math.min(100,S.susp+n);updateMeter();
  if(S.susp>=100){caught();return true;}
  return false;
}
function shake(){
  const c=$('#playcard');if(!c)return;
  c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake');
  sfx('wrong');ME.cnt.wrong++;checkAch();bpAdd('wrong');
  const S=G.S;if(S&&S.msg&&Math.random()<.7)S.msg+=' · '+rp(WRONG_QUIPS);
}

/* ---------- ถูกจับ / จบเกม / ผ่าน / ชนะ ---------- */
function caught(reason){

/* ---------- วาดโจทย์ตามครั้ง ---------- */
function renderStage(){
  const S=G.S;if(!S)return;
  const fn=[renderSeq,renderCam,renderKey,renderWires,renderMM][ST().p];
  if(!fn){$('#stagebody').innerHTML='';return;}
  $('#stagebody').innerHTML='<p class="small muted" style="margin:0 0 10px">'+ST().obstacle+'</p>'+fn();
}

/* ครั้งที่ 1: ลำดับตัวเลข */
function renderSeq(){
  const S=G.S,q=S.seq,it=q.items[q.cur];
  return '<div class="seqmeta"><span>ชุดที่ <b class="mono">'+(q.cur+1)+'</b> จาก <b class="mono">'+q.items.length+'</b></span><span>ตอบถูกทุกชุดประตูถึงจะเปิด</span></div>'
  +'<div class="tiles" role="img" aria-label="ลำดับตัวเลข '+it.shown.join(', ')+' แล้วตามด้วยเลขที่ต้องหา">'+it.shown.map(v=>'<span class="tile">'+v+'</span>').join('')+'<span class="tile q">?</span></div>'
  +'<form data-form="seq" class="row"><label class="sr" for="seqAns">เลขถัดไป</label>'
  +'<input class="field" id="seqAns" type="number" inputmode="numeric" autocomplete="off" placeholder="เลขถัดไป" required>'
  +'<button class="btn primary" type="submit">ป้อนรหัส</button></form>'
  +(it.hintOn?'<p class="hintline">ใบ้: '+it.hint+'</p>':'')
  +'<p class="msg" role="status">'+S.msg+'</p>';
}
function submitSeq(){
  const S=G.S,q=S.seq,it=q.items[q.cur],inp=$('#seqAns');
  if(!inp||inp.value.trim()==='')return;
  const v=Number(inp.value);
  if(v===it.answer){
    q.cur++;S.msg='';
    if(q.cur>=q.items.length){solved();return;}
    renderStage();const e=$('#seqAns');if(e)e.focus();
  }else{
    S.msg='ประตูส่งเสียงเตือน รหัสไม่ถูก';shake();
    if(addSusp(mode().wrong))return;
    renderStage();const e=$('#seqAns');if(e)e.focus();
  }
}
function hintSeq(){const it=G.S.seq.items[G.S.seq.cur];if(it.hintOn)return false;it.hintOn=true;return true;}

/* ครั้งที่ 2: กล้องวงจรปิด */
function renderCam(){
  const S=G.S,C=S.cam,m=mode(),n=C.cams.length,T=C.T,starts=T-n+1;
  const rules=C.cams.map((c,i)=>'<li><b>กล้อง '+(i+1)+'</b> ตั้งแต่วินาทีที่ '+c.f+' จ้อง '+c.w+' วิ แล้วพัก '+(c.p-c.w)+' วิ สลับกันไปเรื่อยๆ (ก่อนหน้านั้นยังพักอยู่)</li>').join('');
  let grid='';
  if(m.cam.grid){
    grid='<div class="scroll"><div class="camgrid" style="--T:'+T+'"><span></span>'
      +Array.from({length:T},(_,t)=>'<span class="tk mono">'+t+'</span>').join('');
    C.cams.forEach((c,i)=>{
      grid+='<span class="cn">กล้อง '+(i+1)+'</span>';
      for(let t=0;t<T;t++){
        const w=camWatching(c,t),p=S.sel!==null&&t===S.sel+i;
        grid+='<span class="cell '+(w?'watch':'safe')+(p?' path':'')+'" aria-label="กล้อง '+(i+1)+' วินาทีที่ '+t+(w?' จ้อง':' พัก')+'">'+(w?'×':'')+'</span>';
      }
    });
    grid+='</div></div><div class="legend"><span class="w">× กล้องจ้อง</span><span class="s">กล้องพัก</span><span>กรอบดำ = ลำดับที่ชุดคำสั่งจะผ่าน</span></div>';
  }
  const chips=Array.from({length:starts},(_,s)=>{
    const out=S.out.has(s);
    return '<button class="chip mono'+(S.sel===s?' on':'')+(out?' out':'')+'" data-act="cam-sel" data-s="'+s+'"'+(out?' disabled':'')+' aria-pressed="'+(S.sel===s)+'">'+s+'</button>';
  }).join('');
  return '<p style="margin:0 0 6px">ชุดคำสั่งจะแตะกล้อง 1 ที่วินาทีที่<b>ตั้งไว้</b> กล้อง 2 ที่วินาทีถัดไป และต่อไปเรื่อยๆ จนครบ '+n+' ตัว ถ้ากล้องตัวไหนกำลังจ้องอยู่ตอนถูกแตะ คำสั่งจะล้มเหลว</p>'
  +'<ul class="camrules">'+rules+'</ul>'+grid
  +'<h3 style="margin-top:14px">ตั้งเวลาเริ่มที่วินาทีที่</h3><div class="chips">'+chips+'</div>'
  +'<button class="btn primary" data-act="cam-go"'+(S.sel===null?' disabled':'')+'>'+(S.sel===null?'เลือกวินาทีก่อน':'ตั้งเวลาที่วินาทีที่ '+S.sel)+'</button>'
  +'<p class="msg" role="status">'+S.msg+'</p>';
}
function camGo(){
  const S=G.S,C=S.cam;if(S.sel===null)return;
  const s=S.sel;
  if(C.valid.includes(s)){solved();return;}
  let who=0;for(let i=0;i<C.cams.length;i++){if(camWatching(C.cams[i],s+i)){who=i;break;}}
  S.out.add(s);S.sel=null;
  S.msg='กล้อง '+(who+1)+' จับภาพคุณได้ตอนวินาทีที่ '+(s+who);shake();
  if(addSusp(mode().wrong))return;
  renderStage();
}
function hintCam(){
  const S=G.S,C=S.cam,n=C.cams.length,starts=C.T-n+1;
  const wrong=[];for(let s=0;s<starts;s++)if(!C.valid.includes(s)&&!S.out.has(s))wrong.push(s);
  if(!wrong.length)return false;
  shuffle(wrong).slice(0,3).forEach(s=>{S.out.add(s);if(S.sel===s)S.sel=null;});
  S.msg='ใบ้: ตัดตัวเลือกที่ผิดออกให้แล้ว';return true;
}

/* ครั้งที่ 3: ลิ้นชักกุญแจ */
function renderKey(){
  const S=G.S,K=S.key;
  const drawers=K.L.map((l,i)=>{
    const why=S.out.get(i);
    return '<button class="drawer'+(why?' out':'')+'" data-act="drawer" data-i="'+i+'"'+(why?' disabled':'')+'>'
      +'<span class="dl">'+l+'</span><span class="sign">'+stmtText(K.st[i],K.L)+'</span><span class="st">'+(why||'')+'</span></button>';
  }).join('');
  return '<p style="margin:0 0 6px"><b>เสียงที่แอบฟังมา:</b> '+K.ruleText+'</p>'
  +'<p class="muted small" style="margin:0">ป้ายแต่ละใบแปะอยู่บนลิ้นชักของตัวเอง คำว่า "นี้" หมายถึงลิ้นชักที่แปะป้ายนั้น</p>'
  +'<div class="drawers">'+drawers+'</div><p class="msg" role="status">'+S.msg+'</p>';
}
function drawerOpen(i){
  const S=G.S,K=S.key;if(S.out.has(i))return;
  if(i===K.answer){solved();return;}
  S.out.set(i,'ว่างเปล่า');S.msg='ลิ้นชัก '+K.L[i]+' ว่างเปล่า และเสียงลิ้นชักดังไปทั้งห้อง';shake();
  if(addSusp(mode().wrong))return;
  renderStage();
}
function hintKey(){
  const S=G.S,K=S.key;
  const c=[];for(let i=0;i<K.n;i++)if(i!==K.answer&&!S.out.has(i))c.push(i);
  if(c.length<=1)return false;
  const i=pick(c);S.out.set(i,'ตัดออก (ใบ้)');S.msg='ใบ้: ลิ้นชัก '+K.L[i]+' ไม่มีกุญแจ';return true;
}

/* ครั้งที่ 4: ตัดสายไฟ */
function renderWires(){
  const S=G.S,Wr=S.wires;
  const wires=Wr.order.map((ci,i)=>{
    const col=WIRE_COLORS[ci],out=Wr.out.has(i);
    return '<button class="wire'+(out?' out':'')+'" data-act="wire" data-i="'+i+'"'+(out?' disabled':'')+' aria-label="สาย'+col.n+(out?' ตัดแล้ว':'')+'">'
      +'<span class="bar" style="background:'+col.c+'"></span><span class="wn">'+col.n+'</span><span class="st">'+(out?'ตัดแล้ว':'')+'</span></button>';

  +'<ul class="camrules">'+Wr.clues.map(t=>'<li>'+t+'</li>').join('')+'</ul>'
  +'<div class="wires">'+wires+'</div><p class="msg" role="status">'+S.msg+'</p>';

function cutWire(i){
  const S=G.S,Wr=S.wires;if(Wr.out.has(i))return;
  if(i===Wr.ans){solved();return;}
  Wr.out.add(i);S.msg='สายสี'+WIRE_COLORS[Wr.order[i]].n+'ไม่ใช่สายหลัก มีประกายไฟแล้วเสียงดังไปทั้งห้อง';shake();
  if(addSusp(mode().wrong))return;
  renderStage();
}
function hintWires(){
  const S=G.S,Wr=S.wires;
  const c=[];for(let i=0;i<Wr.order.length;i++)if(i!==Wr.ans&&!Wr.out.has(i))c.push(i);
  if(c.length<=1)return false;
  const i=pick(c);Wr.out.add(i);S.msg='ใบ้: สายสี'+WIRE_COLORS[Wr.order[i]].n+'ไม่ใช่สายหลัก';return true;
}

/* ครั้งที่ 5: รหัสประตูใหญ่ */
function renderMM(){
  const S=G.S,M=S.mm;
  const hist=M.hist.map(h=>'<li><span class="digits">'+h.g.map(d=>'<b class="mono">'+d+'</b>').join('')+'</span>'
    +'<span class="pegs mono" aria-label="เลขถูกตำแหน่ง '+h.b+' ตัว เลขถูกแต่ผิดตำแหน่ง '+h.c+' ตัว">'+'●'.repeat(h.b)+'○'.repeat(h.c)+(h.b+h.c===0?'ไม่ตรงเลย':'')+'</span>'
    +'<span class="muted small">ตรงตำแหน่ง '+h.b+' · ผิดตำแหน่ง '+h.c+'</span></li>').join('');
  const slots=Array.from({length:M.len},(_,i)=>M.cur[i]!==undefined
    ?'<button class="slot filled" data-act="mm-slot" data-i="'+i+'" aria-label="ลบเลข '+M.cur[i]+'">'+M.cur[i]+'</button>'
    :'<span class="slot" aria-hidden="true"></span>').join('');
  const pad=M.pool.map(d=>{
    const ex=M.excl.has(d);
    return '<button class="key mono'+(ex?' x':'')+'" data-act="mm-digit" data-d="'+d+'"'+(M.cur.includes(d)||ex?' disabled':'')+'>'+d+'</button>';
  }).join('');
  return '<p style="margin:0 0 6px">รหัส <b>'+M.len+' หลัก</b> ใช้เลข '+M.pool[0]+' ถึง '+M.pool[M.pool.length-1]+' และไม่มีเลขซ้ำ เหลืออีก <b class="mono">'+(M.max-M.hist.length)+'</b> ครั้งที่ลองได้</p>'

function normMe(j){
  j=j&&typeof j==='object'?j:{};const b=j.best&&typeof j.best==='object'?j.best:{};
  const nn=x=>{x=+x;return isFinite(x)&&x>0?Math.floor(x):0;};

}
function normOwned(a){
  const out=new Set();
  if(Array.isArray(a))a.forEach(k=>{if(typeof k!=='string')return;const q=k.split(':');if(q.length===2&&itemOf(q[0],q[1])&&itemOf(q[0],q[1]).price>0)out.add(k);});
  return Array.from(out).sort();
}
function normWear(w){
  w=w&&typeof w==='object'?w:{};const o={};
  SLOTS.forEach(sl=>{o[sl[0]]=itemOf(sl[0],w[sl[0]])?w[sl[0]]:DEF_WEAR[sl[0]];});

}
function normAch(a){
  const out=new Set();
  if(Array.isArray(a))a.forEach(k=>{if(typeof k==='string'&&ACH.some(x=>x.id===k))out.add(k);});
  return Array.from(out).sort();
}
function normBp(b){
  b=b&&typeof b==='object'?b:{};
  const nn=(x,m)=>{x=+x;return isFinite(x)&&x>0?Math.min(Math.floor(x),m||1000000):0;};
  const a=(Array.isArray(b.a)?b.a:[]).filter(m=>Array.isArray(m)).slice(0,3).map(m=>[nn(m[0],999)%BP_POOL.length,nn(m[1],999),nn(m[2])]);
  const r={xp:nn(b.xp),lv:Math.min(BP_LV.length,nn(b.lv)),nx:nn(b.nx),a:a};
  bpFill(r);
  r.a.forEach(m=>{m[2]=Math.min(m[2],bpDef(m).t);});
  return r;
}
function mergeBp(rb){
  const lb=ME.bp;
  lb.xp=Math.max(lb.xp,rb.xp);lb.lv=Math.max(lb.lv,rb.lv);
  if(rb.nx>lb.nx){lb.nx=rb.nx;lb.a=rb.a.map(m=>m.slice());}
  else if(rb.nx===lb.nx){lb.a.forEach(m=>{const o=rb.a.find(q=>q[0]===m[0]&&q[1]===m[1]);if(o&&o[2]>m[2])m[2]=o[2];});}
}

const PEER_CDN='https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js';
const P2P_KEYS=['code','name','round','stage','done','ms','go','mob','mode','sc','sk','x','y','f','mv'];

const BAD_TH=['ควย','เหี้ย','สัส','เย็ด','แม่ง','ไอ้สัตว์','อีสัตว์','ส้นตีน','ชาติหมา','ระยำ','กระหรี่','อีดอก','ไปตาย','ฆ่าตัวตาย','ไอ้ห่า','อีห่า','เสือก'];
const BAD_EN=['fuck','shit','bitch','cunt','dick','pussy','nigg','slut','whore','porn','rape','sex','killyourself','nude','asshole'];
function squeeze(s){return String(s==null?'':s).normalize('NFKC').toLowerCase().replace(/0/g,'o').replace(/[1!|]/g,'i').replace(/3/g,'e').replace(/4|@/g,'a').replace(/5|\$/g,'s').replace(/[^a-z฀-๿]/g,'');}
function badText(s){
  const q=squeeze(s);
  if(BAD_TH.some(w=>q.includes(w))||BAD_EN.some(w=>q.includes(w)))return true;
  return /หี(?![ก-๙])/.test(q);
}
const HIDDEN_MSG='ข้อความนี้ถูกซ่อน';
function chatClean(s){
  s=String(s==null?'':s).normalize('NFKC').replace(/[\u0000-\u001f\u007f-\u009f​-‏‪-‮⁠-⁯﻿]/g,' ').replace(/\s+/g,' ').trim().slice(0,80);
  if(!s)return '';
  if(badText(s))return HIDDEN_MSG;
  return s.replace(/(?:https?:\/\/|www\.)\S*/gi,'***').replace(/\S+\.(?:com|net|org|io|me|co|th|xyz|app|gg|ly|tv|cc|info|biz)\b\S*/gi,'***').replace(/\S+@\S+/g,'***').replace(/(?:\+?\d[\s\-.]?){7,}/g,'***');
}
const safeName=s=>{const n=cleanName(s);return badText(n)?'ผู้เล่น':n;};

function wearFrom(str){const a=String(str||'').split(','),o={};SLOTS.forEach((sl,i)=>{o[sl[0]]=a[i];});return normWear(o);}
function p2pClean(p){
  const o={};
  if(!p||typeof p!=='object')return o;
  P2P_KEYS.forEach(k=>{
    const v=p[k];
    if(typeof v==='string')o[k]=k==='name'?safeName(v):v.replace(/[^\w,\-.]/g,'').slice(0,P2P_LEN[k]||24);
    else if(typeof v==='number'&&isFinite(v))o[k]=(k==='x'||k==='y')?Math.max(-2,Math.min(64,Math.round(v*100)/100)):v;
    else if(typeof v==='boolean')o[k]=v;
  });
  return o;
}
function loadPeerJs(){
  if(window.Peer)return Promise.resolve();
  return new Promise((res,rej)=>{
    const t=setTimeout(()=>rej(new Error('peerjs-timeout')),12000);
    const sc=document.createElement('script');
    sc.src=PEER_CDN;sc.async=true;
    sc.onload=()=>{clearTimeout(t);window.Peer?res():rej(new Error('peerjs'));};
    sc.onerror=()=>{clearTimeout(t);rej(new Error('peerjs'));};
    document.head.appendChild(sc);
  });
}
function p2pOpenPeer(id){
  return new Promise((res,rej)=>{
    const p=id?new window.Peer(id):new window.Peer();
    const t=setTimeout(()=>{try{p.destroy();}catch(e){}rej(Object.assign(new Error('timeout'),{type:'timeout'}));},12000);
    p.on('open',()=>{clearTimeout(t);res(p);});
    p.on('error',e=>{clearTimeout(t);try{p.destroy();}catch(x){}rej(e||new Error('peer'));});
  });
}
async function p2pJoin(code,create,tmo){
  try{await loadPeerJs();}
  catch(e){throw new Error('โหลดตัวเชื่อมต่อแบบตรงไม่สำเร็จ ตรวจอินเทอร์เน็ตแล้วลองใหม่');}
  const hostId='iq300-'+code;
  let handlers=[],chatH=[],closed=false,peer=null,hostConn=null,myKey='host',seq=0,dirty=false,timer=0;
  const conns=new Map(),state={},mine={},lastMsg={};
  const list=()=>Object.keys(state).map(k=>({peer:k,kind:'viewer',sameTab:k===myKey,isMe:k===myKey,guest:false,presence:state[k]}));
  const emit=(extra)=>{const arr=list();handlers.slice().forEach(h=>{try{h(Object.assign({peers:arr},extra||{}));}catch(e){console.error(e);}});};
  const sendAll=msg=>{conns.forEach(c=>{try{if(c.open)c.send(msg);}catch(e){}});};
  const flush=()=>{timer=0;if(!dirty)return;dirty=false;sendAll({t:'s',s:state});};
  const broadcast=()=>{dirty=true;if(!timer)timer=setTimeout(flush,90);};
  const deliver=msg=>{chatH.slice().forEach(h=>{try{h({k:String(msg.k),name:safeName(String(msg.n==null?'':msg.n)),text:chatClean(String(msg.m==null?'':msg.m)),isMe:msg.k===myKey});}catch(e){console.error(e);}});};
  const hostChat=(k,text)=>{
    if(typeof text!=='string')return;
    const now=Date.now();if(now-(lastMsg[k]||0)<500)return;lastMsg[k]=now;
    const m=chatClean(text);if(!m)return;
    const msg={t:'c',k:k,n:(state[k]&&state[k].name)||'ผู้เล่น',m:m,i:++seq};
    sendAll(msg);deliver(msg);
  };
  if(create){
    try{peer=await p2pOpenPeer(hostId);}
    catch(e){
      if(e&&e.type==='unavailable-id')throw Object.assign(new Error('ห้องนี้มีคนเปิดอยู่แล้ว กำลังลองเข้าใหม่'),{retry:true});
      throw new Error('สร้างห้องไม่สำเร็จ ตรวจอินเทอร์เน็ตแล้วลองใหม่');
    }
    state[myKey]={};
    peer.on('connection',c=>{
      c.on('open',()=>{
        if(conns.size>=7){try{c.send({t:'full'});}catch(e){}setTimeout(()=>{try{c.close();}catch(e){}},300);return;}
        conns.set(c.peer,c);
        try{c.send({t:'s',s:state});}catch(e){}
      });
      c.on('data',m=>{
        if(!m||!conns.has(c.peer))return;
        if(m.t==='p'){state[c.peer]=p2pClean(m.p);broadcast();emit();}
        else if(m.t==='c')hostChat(c.peer,m.m);
      });
      const drop=()=>{if(conns.delete(c.peer)){delete state[c.peer];broadcast();emit();}};
      c.on('close',drop);c.on('error',drop);
    });
    peer.on('disconnected',()=>{try{peer.reconnect();}catch(e){}});
  }else{
    try{peer=await p2pOpenPeer();}
    catch(e){throw new Error('เชื่อมต่อไม่สำเร็จ ตรวจอินเทอร์เน็ตแล้วลองใหม่');}
    myKey=peer.id;
    let first=null;
    const onData=m=>{
      if(!m)return;
      if(m.t==='full'){closed=true;if(first)first(new Error('ห้องเต็มแล้ว (สูงสุด 8 คน)'));else emit({closed:true,full:true});return;}
      if(m.t==='c'){deliver(m);return;}
      if(m.t==='s'&&m.s&&typeof m.s==='object'){
        Object.keys(state).forEach(k=>{delete state[k];});
        Object.keys(m.s).filter(k=>k.length<=40).slice(0,8).forEach(k=>{state[k]=p2pClean(m.s[k]);});
        if(!(myKey in state))state[myKey]=p2pClean(mine);
        if(first){const f=first;first=null;f();}else emit();
      }
    };
    const nf=()=>Object.assign(new Error('ไม่พบห้องนี้ ตรวจรหัสอีกครั้ง หรือให้เจ้าของห้องเปิดหน้าค้างไว้'),{notFound:true});
    await new Promise((res,rej)=>{
      const t=setTimeout(()=>rej(nf()),tmo||12000);
      first=e=>{clearTimeout(t);e?rej(e):res();};
      const c=peer.connect(hostId,{reliable:true});
      hostConn=c;
      c.on('data',onData);
      peer.on('error',e=>{clearTimeout(t);rej(e&&e.type==='peer-unavailable'?nf():new Error('เชื่อมต่อไม่สำเร็จ ลองใหม่อีกครั้ง'));});
      c.on('error',()=>{clearTimeout(t);rej(new Error('เชื่อมต่อไม่สำเร็จ ลองใหม่อีกครั้ง'));});
    }).catch(e=>{try{peer.destroy();}catch(x){}throw e;});
    const gone=()=>{if(!closed){closed=true;emit({closed:true});}};
    hostConn.on('close',gone);hostConn.on('error',gone);
  }
  return {
    name:'ward-'+code,p2p:true,isHost:!!create,
    presence:async patch=>{
      Object.keys(patch||{}).forEach(k=>{if(patch[k]===null)delete mine[k];else mine[k]=patch[k];});
      state[myKey]=p2pClean(mine);
      if(create){broadcast();emit();}
      else{
        emit();
        if(hostConn&&hostConn.open)hostConn.send({t:'p',p:state[myKey]});
      }
    },
    chat:text=>{
      text=String(text==null?'':text).slice(0,200);
      if(create)hostChat('host',text);
      else if(hostConn&&hostConn.open)hostConn.send({t:'c',m:text});
    },
    onChat:h=>{chatH.push(h);return()=>{chatH=chatH.filter(x=>x!==h);};},
    peers:list,
    onPeers:h=>{handlers.push(h);setTimeout(()=>emit(),0);return()=>{handlers=handlers.filter(x=>x!==h);};},
    leave:async()=>{closed=true;handlers=[];chatH=[];clearTimeout(timer);try{conns.forEach(c=>{try{c.close();}catch(e){}});}catch(e){}try{peer.destroy();}catch(e){}}
  };
}

function racePeers(ch){
  const R=G.race;if(!R)return;
  if(ch&&ch.closed){raceClosed(ch.full);return;}
  R.peers=ch.peers.filter(p=>p.presence&&p.presence.code===R.code&&p.presence.mob===1);
  let max=0,src=null;
  R.peers.forEach(p=>{const g=p.presence.go;if(typeof g==='number'&&isFinite(g)&&g>max){max=g;src=p;}});
  const alive={};
  R.peers.forEach(p=>{
    if(p.sameTab)return;
    const q=p.presence,key='k'+p.peer;alive[key]=1;
    const gh=R.ghosts[key]||(R.ghosts[key]={x:0,y:0,tx:0,ty:0,f:[0,1],mv:false,ph:Math.random()*6,init:false,sk:'',wear:DEF_WEAR,name:'',sc:'',stage:-1,round:-1});
    gh.name=cleanName(q.name)||'ผู้เล่น';gh.sc=q.sc||'';gh.stage=typeof q.stage==='number'?q.stage:-1;gh.round=typeof q.round==='number'?q.round:-1;gh.mv=q.mv===1;
    if(typeof q.x==='number'&&typeof q.y==='number'){gh.tx=q.x;gh.ty=q.y;if(!gh.init){gh.x=q.x;gh.y=q.y;gh.init=true;}}
    if(typeof q.f==='number'){const a=(Math.round(q.f)%8)*Math.PI/4;gh.f=[Math.cos(a),Math.sin(a)];}
    if((q.sk||'')!==gh.sk){gh.sk=q.sk||'';gh.wear=wearFrom(gh.sk);}
  });
  Object.keys(R.ghosts).forEach(k=>{if(!alive[k])delete R.ghosts[k];});
  if(R.seenGo===null){R.seenGo=max;}
  else if(max>R.seenGo){
    R.seenGo=max;
    if(['raceroom','racedone','win','over'].indexOf(G.screen)>=0){startCountdown(max,src&&src.presence.mode);return;}
    toast({tag:'ห้อง '+R.ward,name:'เพื่อนเริ่มรอบใหม่แล้ว',fun:'เล่นรอบนี้ให้จบก่อน แล้วค่อยกดเริ่มพร้อมกันในห้องรอ'});
  }
  raceUiSoon();
}
function raceUi(){
  const R=G.race;if(!R)return;
  if(G.screen==='raceroom'){const l=$('#roomlist');if(l)l.innerHTML=roomListHtml();}
  else if(G.screen==='racedone'){maybeCountWin();renderRaceResult();}
  else if(G.screen==='play'||G.screen==='caught')updateHud();
}
function raceUiSoon(){const R=G.race;if(!R||R.uiTm)return;R.uiTm=setTimeout(()=>{R.uiTm=0;raceUi();},180);}
function raceStart(){
  const R=G.race;if(!R)return;
  let max=R.seenGo||0;(R.peers||[]).forEach(p=>{const g=p.presence&&p.presence.go;if(typeof g==='number'&&g>max)max=g;});
  const go=max+1;R.seenGo=go;
  const md=G.pick||'story';
  raceSend({go,mode:md});
  startCountdown(go,md);
}
function startCountdown(go,md){
  const R=G.race;if(!R)return;
  let m2=(typeof md==='string'&&(md==='race'||ORDER.indexOf(md)>=0))?md:'story';
  if(m2!=='story'&&m2!=='race'&&!unlocked)m2='story';
  clearTimeout(R.cd);stopTimer();
  G.mode=m2;G.stage=0;G.caught=0;G.hints=0;G.playTime=0;G.kos=0;G.bowls=0;G.bowlDone={};G.lives=MODES[m2].lives;G.S=null;
  R.coop=m2!=='race';R.go=go;R.ms=null;R.t0=0;R.countedWin=false;R.mode=m2;G.screen='countdown';
  R.sc='idle';raceSend({round:go,stage:0,done:false,ms:null,mode:m2,sc:'idle'});
  let n=3;const tip=rp(RACE_TIPS);
  const step=()=>{
    if(!G.race||G.screen!=='countdown')return;
    if(n>0){
      main.innerHTML='<section class="folder"><div class="ftab">ห้อง '+R.ward+' · เตรียมตัว</div><div class="card result"><div class="countdown" aria-live="assertive">'+n+'</div><p class="muted">โหมด'+esc(m2==='race'?'แข่งเร็ว':MODES[m2].name)+' · ทุกคนได้โจทย์ชุดเดียวกัน</p><p class="muted small">'+tip+'</p></div></section>';
      n--;R.cd=setTimeout(step,900);
    }else{R.t0=performance.now();beginStage();}
  };
  step();window.scrollTo(0,0);
}
