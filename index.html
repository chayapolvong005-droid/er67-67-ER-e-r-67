   +'<div class="actions"><button class="btn primary" data-act="race-start">เริ่มแข่ง</button><button class="btn ghost" data-act="race-leave">ออกจากห้อง</button></div></div></section>';
  window.scrollTo(0,0);
}
function racePeers(ch){
  const R=G.race;if(!R)return;
  if(ch&&ch.closed){raceClosed(ch.full);return;}
  R.peers=ch.peers.filter(p=>p.presence&&p.presence.code===R.code&&p.presence.mob===1);
  let max=0;R.peers.forEach(p=>{const g=p.presence&&p.presence.go;if(typeof g==='number'&&isFinite(g)&&g>max)max=g;});
  if(R.seenGo===null||(!R.room.p2p&&Date.now()-R.joinedAt<2500)){R.seenGo=Math.max(R.seenGo||0,max);}
  else if(max>R.seenGo){R.seenGo=max;raceSend({round:max,stage:0,done:false,ms:null});startCountdown(max);return;}
  if(G.screen==='raceroom'){const l=$('#roomlist');if(l)l.innerHTML=roomListHtml();}
  else if(G.screen==='racedone'){maybeCountWin();renderRaceResult();}
  else if(G.screen==='play'||G.screen==='caught')updateHud();
}
function raceStart(){
  const R=G.race;if(!R)return;
  let max=R.seenGo||0;(R.peers||[]).forEach(p=>{const g=p.presence&&p.presence.go;if(typeof g==='number'&&g>max)max=g;});
  const go=max+1;R.seenGo=go;
  raceSend({go,round:go,stage:0,done:false,ms:null});
  startCountdown(go);
}
function startCountdown(go){
  const R=G.race;if(!R)return;
  clearTimeout(R.cd);stopTimer();
  G.mode='race';G.stage=0;G.caught=0;G.hints=0;G.playTime=0;G.lives=Infinity;G.S=null;
  R.go=go;R.ms=null;R.t0=0;R.countedWin=false;G.screen='countdown';
  let n=3;const tip=rp(RACE_TIPS);
  const step=()=>{
    if(!G.race||G.screen!=='countdown')return;
    if(n>0){
      main.innerHTML='<section class="folder"><div class="ftab">ห้อง '+esc(R.code.toUpperCase())+' · เตรียมตัว</div><div class="card result"><div class="countdown" aria-live="assertive">'+n+'</div><p class="muted">ทุกคนได้โจทย์ชุดเดียวกัน หนีให้เร็วที่สุด</p><p class="muted small">'+tip+'</p></div></section>';
      n--;R.cd=setTimeout(step,900);
    }else{R.t0=performance.now();beginStage();}
  };
  step();window.scrollTo(0,0);
}
function raceRacers(){
  const R=G.race,out=[];
  (R.peers||[]).forEach(p=>{
    if(p.sameTab||p.kind!=='viewer')return;
    const q=p.presence||{};if(q.round!==R.go)return;
    out.push({me:false,name:cleanName(q.name)||'ผู้เล่น',stage:Math.max(0,Math.min(TOTAL,Math.floor(+q.stage)||0)),done:q.done===true,ms:numOk(q.ms)||0});
  });
  out.push({me:true,name:raceName(),stage:G.stage,done:R.ms!=null,ms:R.ms||0});
  return out.sort((a,b)=>(a.done&&b.done)?a.ms-b.ms:a.done?-1:b.done?1:b.stage-a.stage);
}
function raceHudInner(){
  const R=G.race;
  const rows=raceRacers().map(r=>{
    const segs=Array.from({length:TOTAL},(_,i)=>'<i class="'+(r.done||i<r.stage?'done':i===r.stage?'cur':'')+'"></i>').join('');
    return '<div class="rrow'+(r.me?' me':'')+'"><span class="rname">'+esc(r.name)+(r.me?' (คุณ)':'')+'</span><span class="rbar">'+segs+'</span><span class="rms mono">'+(r.done?fmtMs(r.ms):'ด่าน '+Math.min(r.stage+1,TOTAL)+'/'+TOTAL)+'</span></div>';
  }).join('');
  return '<div class="rhead"><b>แข่งออนไลน์ · ห้อง '+esc(R.code.toUpperCase())+'</b><span class="mono" id="racetime">'+fmtMs(R.ms!=null?R.ms:(R.t0?performance.now()-R.t0:0))+'</span></div>'+rows;
}
function raceHud(){return G.race&&G.mode==='race'?'<section class="racehud" id="racehud" aria-label="ผู้แข่งขัน">'+raceHudInner()+'</section>':'';}
function updateHud(){const e=$('#racehud');if(e&&G.race)e.innerHTML=raceHudInner();}
function raceAdvance(){
  if(G.stage>=TOTAL-1){finishRace();return;}
  G.stage++;raceSend({stage:G.stage});beginStage();
}
function finishRace(){
  const R=G.race;stopTimer();
  R.ms=Math.round(performance.now()-R.t0);G.screen='racedone';
  raceSend({stage:TOTAL,done:true,ms:R.ms});
  ME.racePlayed++;ME.bowls+=5;ME.raceBest=minN(ME.raceBest,R.ms);
  pushMe();
  sfx('win');confetti();checkAch();bpAdd('race');
  maybeCountWin();renderRaceResult();
}
function maybeCountWin(){
  const R=G.race;if(!R||R.countedWin||R.ms==null)return;
  const rs=raceRacers();
  if(rs.length>=2&&rs.every(r=>r.done)){
    R.countedWin=true;
    if(rs[0].me){ME.raceWins++;pushMe();checkAch();}
  }
}
function renderRaceResult(){
  const R=G.race;if(!R||G.screen!=='racedone')return;
  const rs=raceRacers(),all=rs.every(r=>r.done),first=rs[0];
  const lead=rs.length<2?'คุณหนีออกมาได้ใน '+fmtMs(R.ms)+' ยังไม่มีคู่แข่งในห้อง'
    :all?(first.me?'คุณหนีเร็วที่สุดในห้อง':esc(first.name)+' หนีเร็วที่สุดในห้อง'):'คุณหนีออกมาแล้ว รอเพื่อนที่ยังหนีไม่เสร็จ';
  const list='<ol class="board">'+rs.map((r,i)=>'<li class="'+(r.me?'me':'')+'"><span class="rk">'+(r.done?i+1:'-')+'</span><span class="nm">'+esc(r.name)+(r.me?' (คุณ)':'')+'</span><span class="tm">'+(r.done?fmtMs(r.ms):'ด่าน '+Math.min(r.stage+1,TOTAL)+'/'+TOTAL)+'</span></li>').join('')+'</ol>';
  main.innerHTML='<div class="topbar"><div class="who"><span class="hn">แข่งออนไลน์</span>ห้อง '+esc(R.code.toUpperCase())+'</div><div class="meta"><button class="btn-link" data-act="home">ออกจากห้อง</button></div></div>'
   +'<section class="folder"><div class="ftab">ผลการแข่ง</div><div class="card result"><span class="stamp ok">'+(all&&first.me&&rs.length>=2?'ชนะ':'หนีได้')+'</span>'
   +'<p class="lead">'+lead+'</p>'+list
   +'<div class="actions"><button class="btn primary" data-act="race-start">แข่งอีกรอบ</button><button class="btn ghost" data-act="board">ลีดเดอร์บอร์ด</button><button class="btn ghost" data-act="race-leave">ออกจากห้อง</button></div></div></section>';
}
function leaveRace(){
  const R=G.race;if(!R)return;
  clearTimeout(R.cd);
  try{if(R.unsub)R.unsub();}catch(e){}
  try{Promise.resolve(R.room.leave()).catch(()=>{});}catch(e){}
  G.race=null;if(G.mode==='race')G.mode=null;
}

function wdLoop(now){
  WD.raf=0;
  if(G.screen!=='wardrobe')return;
  const cv=$('#wdcv');
  if(cv){
    const c=cv.getContext('2d'),t=now/1000;
    c.clearRect(0,0,cv.width,cv.height);
    c.save();c.translate(90,150+Math.sin(t*3));c.scale(3.6,3.6);
    drawHero(c,0,0,{wear:WD.pre,fx:0,fy:-1,sw:0,t,eyes:true});
    c.restore();
  }
  WD.raf=requestAnimationFrame(wdLoop);
}
function wdWear(){
  const slot=WD.slot,it=itemOf(slot,WD.pre[slot]);if(!it)return;
  if(!hasItem(slot,it.id)){
    if(it.lock||balance()<it.price)return;
    ME.spent+=it.price;ME.owned=normOwned(ME.owned.concat([slot+':'+it.id]));sfx('solve');
  }else sfx('pickup');
  ME.wear[slot]=it.id;saveLocal();pushMe();checkAch();showWardrobe(true);
}

function finClockText(){

function finLoop(now){
  if(G.screen!=='finale')return;
  const F=FIN,dt=Math.min((now-F.last)/1000,.05);
  F.last=now;F.t+=dt;
  if(F.tgt){
    const dx=F.tgt[0]-F.hero.x,dy=F.tgt[1]-F.hero.y,d=Math.hypot(dx,dy);
    if(d<2){F.hero.x=F.tgt[0];F.hero.y=F.tgt[1];F.tgt=null;F.hero.moving=false;}
    else{const sp=Math.min(d,75*dt);F.hero.x+=dx/d*sp;F.hero.y+=dy/d*sp;F.hero.walk+=dt;}
  }
  F.guests.forEach(g=>{
    if(g.done)return;
    const dx=g.tx-g.x,dy=g.ty-g.y,d=Math.hypot(dx,dy);
    if(d<2){g.done=true;}else{const sp=Math.min(d,70*dt);g.x+=dx/d*sp;g.y+=dy/d*sp;g.w+=dt;}
  });
  if(F.clock<F.clockT){F.clock=Math.min(F.clockT,F.clock+dt*.45);finClockText();}
  if(F.closing&&!F.closed&&F.clock>=F.clockT-1e-6){F.closed=true;F.closeAt=F.t+1.8;F.dimT=.5;sfx('bell');}
  F.dim+=(F.dimT-F.dim)*Math.min(1,dt*1.5);
  if(F.eating){
    F.eat=Math.min(1,F.eat+dt/3.6);F.bowlFill=1-F.eat;
    F.slurpT-=dt;if(F.slurpT<=0&&F.eat<.95){sfx('slurp');F.slurpT=.6;}
    if(F.eat>=1){F.eating=false;F.bowlFill=0;}
  }
  if(!F.ready&&F.waitFor&&F.waitFor())setReady(true);
  const cv=$('#fin');
  if(cv)drawShop(cv.getContext('2d'),F);
  F.raf=requestAnimationFrame(finLoop);
}

   +'<div class="xpbar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+pct+'" aria-label="ความคืบหน้าไปเลเวลถัดไป"><i style="width:'+pct+'%"></i></div>'
   +'<p class="muted small nx">XP '+bp.xp+' · รางวัลเข้ากระเป๋าอัตโนมัติเมื่อขึ้นเลเวล</p></div>'
   +'<div class="bpbody"><div class="bpm">'+ms+'</div>'+rw+'</div>'
   +'</div></section>';
  if(pop==null)window.scrollTo(0,0);
}
function showAch(){
  stopTimer();G.screen='ach';
  const items=ACH.map(a=>{
    const got=ME.ach.includes(a.id),hid=a.secret&&!got;
    let st;
    if(got)st='ได้แล้ว +'+a.r+' ชาม';
    else if(a.p){const v=a.p();st=hid?'เหรียญลับ':Math.min(v[0],v[1])+'/'+v[1]+' · รางวัล +'+a.r+' ชาม';}
    else st='ทำภารกิจพิเศษ · รางวัล +'+a.r+' ชาม';
    return '<li class="ach'+(got?' got':'')+'"><b>'+(hid?'???':esc(a.name))+'</b><span>'+esc(a.desc)+'</span><span class="st">'+st+'</span>'+(got?'<span class="fun">'+esc(a.fun)+'</span>':'')+'</li>';
  }).join('');
  main.innerHTML='<div class="topbar"><div class="who"><span class="hn">เหรียญความสำเร็จ</span>ของคนไข้ห้อง 407</div><div class="meta"><button class="btn-link" data-act="home">หน้าแรก</button></div></div>'
   +'<section class="folder"><div class="ftab">ได้แล้ว '+ME.ach.length+' จาก '+ACH.length+' เหรียญ</div><div class="card">'
   +'<p class="muted small" style="margin:0">ทุกเหรียญให้ชามก๋วยเตี๋ยวเป็นรางวัล เอาไปซื้อชุดหรือแมวที่ห้องแต่งตัวได้</p>'
   +'<ul class="achs">'+items+'</ul></div></section>';
  window.scrollTo(0,0);
}
const ACT={
  begin:b=>startMode(b.dataset.mode),
  go:()=>beginStage(),
  retry:()=>beginStage(),
  next:()=>{if(G.stage>=TOTAL-1&&!(G.mode==='rage'&&G.stage===TOTAL-1)){finale();}else{G.stage++;brief();}},
  hint:()=>useHint(),
  home:b=>{
    if(G.screen==='play'&&!G.exitArm){
      G.exitArm=true;b.textContent='กดอีกครั้งเพื่อออก';
      setTimeout(()=>{G.exitArm=false;if(b.isConnected)b.textContent='หน้าแรก';},2500);return;
    }
    G.exitArm=false;showHome();
  },
  'cam-sel':b=>{const s=Number(b.dataset.s);G.S.sel=G.S.sel===s?null:s;G.S.msg='';renderStage();},
  'cam-go':()=>camGo(),
  drawer:b=>drawerOpen(Number(b.dataset.i)),
  wire:b=>cutWire(Number(b.dataset.i)),
  'mm-digit':b=>{const M=G.S.mm,d=Number(b.dataset.d);if(M.cur.length<M.len&&!M.cur.includes(d)){M.cur.push(d);renderStage();}},
  'mm-slot':b=>{G.S.mm.cur.splice(Number(b.dataset.i),1);renderStage();},
  'mm-clear':()=>{G.S.mm.cur=[];renderStage();},
  'mm-send':()=>mmSend(),use:()=>openPuzzle(),'close-puzzle':()=>closePuzzle(),
  board:()=>showBoard(),'board-tab':b=>{boardTab=b.dataset.t;showBoard(true);},
  race:()=>showRace(),'race-create':()=>raceJoin(randCode(),true),'race-start':()=>raceStart(),
  'race-leave':()=>{leaveRace();showRace();},
  punch:b=>{punch();b.blur();},
  rage:b=>{goRage();b.blur();},
  snd:()=>{
    sndOn=!sndOn;try{localStorage.setItem('iq300-snd',sndOn?'1':'0');}catch(e){}
    document.querySelectorAll('[data-act="snd"]').forEach(x=>{x.textContent='เสียง: '+(sndOn?'เปิด':'ปิด');x.setAttribute('aria-pressed',String(sndOn));});
    if(sndOn)sfx('pickup');
  },
  wardrobe:()=>{WD.pre=Object.assign({},ME.wear);WD.slot='outfit';showWardrobe();},
  'wd-slot':b=>{WD.slot=b.dataset.s;showWardrobe(true);},
  'wd-pick':b=>{WD.pre[WD.slot]=b.dataset.id;showWardrobe(true);},
  'wd-wear':()=>wdWear(),
  ach:()=>showAch(),
  norot:()=>document.documentElement.classList.add('norot'),
  'bp-skip':b=>bpSkip(Number(b.dataset.i)),
  pass:()=>showPass(),
  'fin-next':()=>finNext(),
  'fin-ans':b=>finAns(Number(b.dataset.i)),
  'fin-skip':()=>{cancelAnimationFrame(FIN.raf);win();},
  iq:()=>{const e=$('#iqmsg');iqN=(iqN+1)%IQ_LINES.length;if(e)e.textContent=IQ_LINES[iqN];sfx('pickup');ME.cnt.iq++;checkAch();}
};
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');
  if(!b||b.disabled)return;
  const f=ACT[b.dataset.act];
  if(f)f(b);
});
document.addEventListener('submit',e=>{
  const f=e.target.closest('[data-form]');
  if(!f)return;
  e.preventDefault();
  if(f.dataset.form==='seq'&&G.screen==='play')submitSeq();
  else if(f.dataset.form==='name')saveName(f.dataset.input);
  else if(f.dataset.form==='racejoin'){const c=$('#racecode');raceJoin(c?c.value:'',false);}
});

showHome();initServices();
})();
</script>

</body>
